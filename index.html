- Does he say "Good morning"? \u2014 \u0412\u0456\u043D \u043A\u0430\u0436\u0435 \xAB\u0414\u043E\u0431\u0440\u043E\u0433\u043E \u0440\u0430\u043D\u043A\u0443\xBB?`,de:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- ich \u2014 \u044F, du \u2014 \u0442\u0438, er \u2014 \u0432\u0456\u043D, sie \u2014 \u0432\u043E\u043D\u0430, es \u2014 \u0432\u043E\u043D\u043E
- wir \u2014 \u043C\u0438, ihr \u2014 \u0432\u0438 (\u043C\u043D.), sie \u2014 \u0432\u043E\u043D\u0438
- Sie \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.): \u0437\u0430\u0432\u0436\u0434\u0438 \u0437 \u0432\u0435\u043B\u0438\u043A\u043E\u0457 \u043B\u0456\u0442\u0435\u0440\u0438, \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u2014 \u044F\u043A \u0456\u0437 sie (\u0432\u043E\u043D\u0438).

# \u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F
\u0412\u0456\u0434 \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432\u0430 \u0432\u0456\u0434\u043A\u0438\u0434\u0430\u0454\u043C\u043E -en \u0456 \u0434\u043E\u0434\u0430\u0454\u043C\u043E \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- \u041A\u043E\u0440\u0456\u043D\u044C \u043D\u0430 -d / -t \u2014 \u0432\u0441\u0442\u0430\u0432\u043D\u0435 e: du wartest, er wartet.
- \u041A\u043E\u0440\u0456\u043D\u044C \u043D\u0430 -s / -\xDF / -z \u2014 \u0443 du \u043B\u0438\u0448\u0435 -t: du reist.
- \u0406\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432 \u043D\u0430 -eln: ich sammle, \u0430\u043B\u0435 du sammelst.

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u0414\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0441\u0442\u0430\u0454 \u043D\u0430 \u043F\u0435\u0440\u0448\u0435 \u043C\u0456\u0441\u0446\u0435, \u0437\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u2014 \u043E\u0434\u0440\u0430\u0437\u0443 \u043F\u0456\u0441\u043B\u044F \u043D\u044C\u043E\u0433\u043E:
- Lebst du? \u2014 \u0422\u0438 \u0436\u0438\u0432\u0435\u0448?
- Warten Sie? \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.) \u0447\u0435\u043A\u0430\u0454\u0442\u0435?
- H\xF6rt ihr? \u2014 \u0412\u0438 (\u043C\u043D.) \u0447\u0443\u0454\u0442\u0435?

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
nicht \u0441\u0442\u043E\u0457\u0442\u044C \u043F\u0456\u0441\u043B\u044F \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430, \u0443 \u043A\u0456\u043D\u0446\u0456 \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0433\u043E \u0440\u0435\u0447\u0435\u043D\u043D\u044F:
- Ich lerne nicht. \u2014 \u042F \u043D\u0435 \u0432\u0447\u0443.
- Sie glauben nicht. \u2014 \u0412\u043E\u043D\u0438 \u043D\u0435 \u0432\u0456\u0440\u044F\u0442\u044C.
- \u0417 \u043E\u0431'\u0454\u043A\u0442\u043E\u043C: Er sagt nicht Hallo. (\u0443 \u0432\u043F\u0440\u0430\u0432\u0430\u0445 \u043F\u0440\u0438\u0439\u043C\u0430\u0454\u0442\u044C\u0441\u044F \u0439 Er sagt Hallo nicht.)`,pl:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- ja \u2014 \u044F, ty \u2014 \u0442\u0438, on \u2014 \u0432\u0456\u043D, ona \u2014 \u0432\u043E\u043D\u0430, ono \u2014 \u0432\u043E\u043D\u043E
- my \u2014 \u043C\u0438, wy \u2014 \u0432\u0438 (\u043C\u043D.), oni / one \u2014 \u0432\u043E\u043D\u0438
- \u0412\u0432\u0456\u0447\u043B\u0438\u0432\u043E: Pan (\u0434\u043E \u0447\u043E\u043B\u043E\u0432\u0456\u043A\u0430), Pani (\u0434\u043E \u0436\u0456\u043D\u043A\u0438) + \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0432 3-\u0439 \u043E\u0441\u043E\u0431\u0456: Pan czeka.
- \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u0447\u0430\u0441\u0442\u043E \u043E\u043F\u0443\u0441\u043A\u0430\u044E\u0442\u044C: Czekam. = Ja czekam.

# \u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F
\u0414\u0432\u0456 \u043D\u0430\u0439\u0447\u0430\u0441\u0442\u0456\u0448\u0456 \u043C\u043E\u0434\u0435\u043B\u0456 \u0442\u0435\u043F\u0435\u0440\u0456\u0448\u043D\u044C\u043E\u0433\u043E \u0447\u0430\u0441\u0443:
- -am: czekam, czekasz, czeka, czekamy, czekacie, czekaj\u0105
- -\u0119: robi\u0119, robisz, robi, robimy, robicie, robi\u0105
- -owa\u0107 \u2192 -uj\u0119: podr\xF3\u017Cuj\u0119, podr\xF3\u017Cujesz, podr\xF3\u017Cuje \u2026
- uczy\u0107 si\u0119 \u2014 \u0437\u0432\u043E\u0440\u043E\u0442\u043D\u0435: ucz\u0119 si\u0119, uczysz si\u0119, uczy si\u0119 \u2026

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u041D\u0430 \u043F\u043E\u0447\u0430\u0442\u043A\u0443 \u2014 \u0447\u0430\u0441\u0442\u043A\u0430 czy (\u0430\u0431\u043E \u043F\u0440\u043E\u0441\u0442\u043E \u0456\u043D\u0442\u043E\u043D\u0430\u0446\u0456\u044F):
- Czy ty czekasz? \u2014 \u0422\u0438 \u0447\u0435\u043A\u0430\u0454\u0448?
- Czy Pan wierzy? \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.) \u0432\u0456\u0440\u0438\u0442\u0435?
- Czy oni s\u0142ysz\u0105? \u2014 \u0412\u043E\u043D\u0438 \u0447\u0443\u044E\u0442\u044C?

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
nie \u0441\u0442\u043E\u0457\u0442\u044C \u043F\u0435\u0440\u0435\u0434 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E\u043C:
- Ja nie pytam. \u2014 \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E.
- Ona nie kocha. \u2014 \u0412\u043E\u043D\u0430 \u043D\u0435 \u043B\u044E\u0431\u0438\u0442\u044C.`,es:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- yo \u2014 \u044F, t\xFA \u2014 \u0442\u0438, \xE9l \u2014 \u0432\u0456\u043D, ella \u2014 \u0432\u043E\u043D\u0430
- nosotros / nosotras \u2014 \u043C\u0438, vosotros / vosotras \u2014 \u0432\u0438 (\u043C\u043D.)
- ellos / ellas \u2014 \u0432\u043E\u043D\u0438
- usted \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.), \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0432 3-\u0439 \u043E\u0441\u043E\u0431\u0456 \u043E\u0434\u043D\u0438\u043D\u0438: usted vive.
- \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u0437\u0430\u0437\u0432\u0438\u0447\u0430\u0439 \u043E\u043F\u0443\u0441\u043A\u0430\u044E\u0442\u044C: Vivo. = Yo vivo.

# \u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F
\u0422\u0440\u0438 \u0433\u0440\u0443\u043F\u0438 \u0437\u0430 \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432\u043E\u043C:
- -ar (esperar): espero, esperas, espera, esperamos, esper\xE1is, esperan
- -er (aprender): aprendo, aprendes, aprende, aprendemos, aprend\xE9is, aprenden
- -ir (vivir): vivo, vives, vive, vivimos, viv\xEDs, viven
- \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456: hacer \u2192 hago, decir \u2192 digo, o\xEDr \u2192 oigo, mostrar \u2192 muestro, sentir \u2192 siento.

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u0417\u043D\u0430\u043A\u0438 \xBF \u2026 ? \u0441\u0442\u0430\u0432\u043B\u044F\u0442\u044C\u0441\u044F \u0437 \u043E\u0431\u043E\u0445 \u0431\u043E\u043A\u0456\u0432; \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0447\u0430\u0441\u0442\u043E \u0439\u0434\u0435 \u043F\u0435\u0440\u0448\u0438\u043C:
- \xBFVives t\xFA? \u0430\u0431\u043E \xBFT\xFA vives? \u2014 \u0422\u0438 \u0436\u0438\u0432\u0435\u0448?
- \xBFEspera usted? \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.) \u0447\u0435\u043A\u0430\u0454\u0442\u0435?

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
no \u0441\u0442\u043E\u0457\u0442\u044C \u043F\u0435\u0440\u0435\u0434 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E\u043C:
- Yo no espero. \u2014 \u042F \u043D\u0435 \u0447\u0435\u043A\u0430\u044E.
- Ellos no creen. \u2014 \u0412\u043E\u043D\u0438 \u043D\u0435 \u0432\u0456\u0440\u044F\u0442\u044C.`,fr:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- je (j' \u043F\u0435\u0440\u0435\u0434 \u0433\u043E\u043B\u043E\u0441\u043D\u043E\u044E) \u2014 \u044F, tu \u2014 \u0442\u0438, il \u2014 \u0432\u0456\u043D, elle \u2014 \u0432\u043E\u043D\u0430
- nous \u2014 \u043C\u0438, vous \u2014 \u0432\u0438 (\u043C\u043D.) \u0456 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.), ils / elles \u2014 \u0432\u043E\u043D\u0438

# \u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F
\u0414\u0456\u0454\u0441\u043B\u043E\u0432\u0430 \u043D\u0430 -er (aimer):
- j'aime, tu aimes, il / elle aime
- nous aimons, vous aimez, ils / elles aiment
- -e, -es, -ent \u043D\u0435 \u0432\u0438\u043C\u043E\u0432\u043B\u044F\u044E\u0442\u044C\u0441\u044F: aime, aimes, aiment \u0437\u0432\u0443\u0447\u0430\u0442\u044C \u043E\u0434\u043D\u0430\u043A\u043E\u0432\u043E.
- \u0406\u043D\u0448\u0456 \u0433\u0440\u0443\u043F\u0438: attendre \u2192 j'attends, il attend; croire \u2192 je crois, nous croyons.
- \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456: faire \u2192 je fais, vous faites, ils font; dire \u2192 vous dites.

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
- Est-ce que \u043D\u0430 \u043F\u043E\u0447\u0430\u0442\u043A\u0443: Est-ce que tu attends\xA0? \u2014 \u0422\u0438 \u0447\u0435\u043A\u0430\u0454\u0448?
- \u041F\u0435\u0440\u0435\u0434 \u0433\u043E\u043B\u043E\u0441\u043D\u043E\u044E \u2014 est-ce qu': Est-ce qu'il croit\xA0?
- \u0420\u043E\u0437\u043C\u043E\u0432\u043D\u043E \u2014 \u043B\u0438\u0448\u0435 \u0456\u043D\u0442\u043E\u043D\u0430\u0446\u0456\u0454\u044E: Tu attends\xA0?
- \u041F\u0435\u0440\u0435\u0434 ? \u0456 ! \u0443 \u0444\u0440\u0430\u043D\u0446\u0443\u0437\u044C\u043A\u0456\u0439 \u0441\u0442\u0430\u0432\u0438\u0442\u044C\u0441\u044F \u043F\u0440\u043E\u0431\u0456\u043B.

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
ne \u2026 pas \u043E\u0431\u0440\u0430\u043C\u043B\u044E\u044E\u0442\u044C \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E (n' \u043F\u0435\u0440\u0435\u0434 \u0433\u043E\u043B\u043E\u0441\u043D\u043E\u044E):
- Je ne demande pas. \u2014 \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E.
- Il n'aime pas. \u2014 \u0412\u0456\u043D \u043D\u0435 \u043B\u044E\u0431\u0438\u0442\u044C.`},pn={en:`# Pronouns
- I, you, he, she, it, we, you (plural), they
- \xAByou\xBB covers one person, many people and the formal address.

# Present Simple
The verb barely changes: only he / she / it add -s.
- I live, he lives; she watches, he does (-es after -sh, -ch, -ss, -x, -o)

# Questions
do (does for he / she) goes first, the verb has no -s:
- Do you live? Does she wait?

# Negation
don't / doesn't after the pronoun:
- I don't ask. He doesn't believe.`,uk:`# Pronouns
- \u044F \u2014 I, \u0442\u0438 \u2014 you, \u0432\u0456\u043D \u2014 he, \u0432\u043E\u043D\u0430 \u2014 she, \u0432\u043E\u043D\u043E \u2014 it
- \u043C\u0438 \u2014 we, \u0432\u0438 \u2014 you (plural), \u0412\u0438 \u2014 you (formal), \u0432\u043E\u043D\u0438 \u2014 they
- The pronoun may be dropped: \u0416\u0438\u0432\u0443. = \u042F \u0436\u0438\u0432\u0443.

# Present tense
Two conjugation patterns:
- \u0436\u0438\u0442\u0438: \u0436\u0438\u0432\u0443, \u0436\u0438\u0432\u0435\u0448, \u0436\u0438\u0432\u0435, \u0436\u0438\u0432\u0435\u043C\u043E, \u0436\u0438\u0432\u0435\u0442\u0435, \u0436\u0438\u0432\u0443\u0442\u044C
- \u043B\u044E\u0431\u0438\u0442\u0438: \u043B\u044E\u0431\u043B\u044E, \u043B\u044E\u0431\u0438\u0448, \u043B\u044E\u0431\u0438\u0442\u044C, \u043B\u044E\u0431\u0438\u043C\u043E, \u043B\u044E\u0431\u0438\u0442\u0435, \u043B\u044E\u0431\u043B\u044F\u0442\u044C

# Questions
Word order stays the same \u2014 only intonation and \xAB?\xBB (or \u0447\u0438 at the start):
- \u0422\u0438 \u0436\u0438\u0432\u0435\u0448? / \u0427\u0438 \u0442\u0438 \u0436\u0438\u0432\u0435\u0448? \u2014 Do you live?

# Negation
\u043D\u0435 goes before the verb:
- \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E. \u2014 I don't ask.`,de:`# Pronouns
- ich \u2014 I, du \u2014 you, er \u2014 he, sie \u2014 she, es \u2014 it
- wir \u2014 we, ihr \u2014 you (plural), sie \u2014 they
- Sie \u2014 you (formal): always capitalised, the verb is the same as with sie (they).

# Endings
Drop -en from the infinitive and add the ending: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- Stem ending in -d / -t adds an e: du wartest, er wartet.
- Stem ending in -s / -\xDF / -z: du takes only -t: du reist.
- Infinitive in -eln: ich sammle, but du sammelst.

# Questions
The verb goes first, the pronoun right after it:
- Lebst du? \u2014 Do you live?
- Warten Sie? \u2014 Do you (formal) wait?
- H\xF6rt ihr? \u2014 Do you (plural) hear?

# Negation
nicht follows the verb, at the end of a short sentence:
- Ich lerne nicht. \u2014 I don't learn.
- Sie glauben nicht. \u2014 They don't believe.
- With an object: Er sagt nicht Hallo. (Er sagt Hallo nicht. is accepted too.)`,pl:`# Pronouns
- ja \u2014 I, ty \u2014 you, on \u2014 he, ona \u2014 she, ono \u2014 it
- my \u2014 we, wy \u2014 you (plural), oni / one \u2014 they
- Formal: Pan (to a man), Pani (to a woman) + 3rd person verb: Pan czeka.
- The pronoun is often dropped: Czekam. = Ja czekam.

# Endings
The two most common present-tense patterns:
- -am: czekam, czekasz, czeka, czekamy, czekacie, czekaj\u0105
- -\u0119: robi\u0119, robisz, robi, robimy, robicie, robi\u0105
- -owa\u0107 \u2192 -uj\u0119: podr\xF3\u017Cuj\u0119, podr\xF3\u017Cujesz, podr\xF3\u017Cuje \u2026
- uczy\u0107 si\u0119 is reflexive: ucz\u0119 si\u0119, uczysz si\u0119, uczy si\u0119 \u2026

# Questions
Start with the particle czy (or just use intonation):
- Czy ty czekasz? \u2014 Do you wait?
- Czy Pan wierzy? \u2014 Do you (formal) believe?
- Czy oni s\u0142ysz\u0105? \u2014 Do they hear?

# Negation
nie goes before the verb:
- Ja nie pytam. \u2014 I don't ask.
- Ona nie kocha. \u2014 She doesn't love.`,es:`# Pronouns
- yo \u2014 I, t\xFA \u2014 you, \xE9l \u2014 he, ella \u2014 she
- nosotros / nosotras \u2014 we, vosotros / vosotras \u2014 you (plural)
- ellos / ellas \u2014 they
- usted \u2014 you (formal), verb in the 3rd person singular: usted vive.
- The pronoun is usually dropped: Vivo. = Yo vivo.

# Endings
Three groups by infinitive:
- -ar (esperar): espero, esperas, espera, esperamos, esper\xE1is, esperan
- -er (aprender): aprendo, aprendes, aprende, aprendemos, aprend\xE9is, aprenden
- -ir (vivir): vivo, vives, vive, vivimos, viv\xEDs, viven
- Irregular: hacer \u2192 hago, decir \u2192 digo, o\xEDr \u2192 oigo, mostrar \u2192 muestro, sentir \u2192 siento.

# Questions
\xBF \u2026 ? go on both sides; the verb often comes first:
- \xBFVives t\xFA? or \xBFT\xFA vives? \u2014 Do you live?
- \xBFEspera usted? \u2014 Do you (formal) wait?

# Negation
no goes before the verb:
- Yo no espero. \u2014 I don't wait.
- Ellos no creen. \u2014 They don't believe.`,fr:`# Pronouns
- je (j' before a vowel) \u2014 I, tu \u2014 you, il \u2014 he, elle \u2014 she
- nous \u2014 we, vous \u2014 you (plural) and you (formal), ils / elles \u2014 they

# Endings
Verbs in -er (aimer):
- j'aime, tu aimes, il / elle aime
- nous aimons, vous aimez, ils / elles aiment
- -e, -es, -ent are silent: aime, aimes, aiment sound the same.
- Other groups: attendre \u2192 j'attends, il attend; croire \u2192 je crois, nous croyons.
- Irregular: faire \u2192 je fais, vous faites, ils font; dire \u2192 vous dites.

# Questions
- Est-ce que at the start: Est-ce que tu attends\xA0? \u2014 Do you wait?
- Before a vowel \u2014 est-ce qu': Est-ce qu'il croit\xA0?
- Colloquially \u2014 intonation only: Tu attends\xA0?
- French puts a space before ? and !.

# Negation
ne \u2026 pas wrap the verb (n' before a vowel):
- Je ne demande pas. \u2014 I don't ask.
- Il n'aime pas. \u2014 He doesn't love.`},mn={en:`# \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430
\u0423 \u0442\u0435\u043F\u0435\u0440\u0456\u0448\u043D\u044C\u043E\u043C\u0443 \u0447\u0430\u0441\u0456 \u0430\u043D\u0433\u043B\u0456\u0439\u0441\u044C\u043A\u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430 \u043C\u0430\u0439\u0436\u0435 \u0432\u0441\u0456 \xAB\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456\xBB: he / she \u0434\u043E\u0434\u0430\u0454 -s.
\u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456 \u0432\u043E\u043D\u0438 \u0432 \u043C\u0438\u043D\u0443\u043B\u043E\u043C\u0443 \u0447\u0430\u0441\u0456 (slept, ate, wrote) \u2014 \u0446\u0435 \u0431\u0443\u0434\u0435 \u0432 \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u0438\u0445 \u0443\u0440\u043E\u043A\u0430\u0445.
- fly \u2192 he flies (y \u043F\u0456\u0441\u043B\u044F \u043F\u0440\u0438\u0433\u043E\u043B\u043E\u0441\u043D\u043E\u0457 \u2192 ies)
- I know \u2014 \u044F \u0437\u043D\u0430\u044E; she knows \u2014 \u0432\u043E\u043D\u0430 \u0437\u043D\u0430\u0454

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F \u0439 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
\u0422\u0430\u043A \u0441\u0430\u043C\u043E, \u044F\u043A \u0432 \u0443\u0440\u043E\u0446\u0456 1:
- Do you sleep? \u2014 \u0422\u0438 \u0441\u043F\u0438\u0448?
- Does he swim? \u2014 \u0412\u0456\u043D \u043F\u043B\u0430\u0432\u0430\u0454?
- She doesn't lie. \u2014 \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435.`,de:`# \u0417\u043C\u0456\u043D\u0430 \u043A\u043E\u0440\u0435\u043D\u044F
\u0411\u0430\u0433\u0430\u0442\u043E \u0441\u0438\u043B\u044C\u043D\u0438\u0445 \u0434\u0456\u0454\u0441\u043B\u0456\u0432 \u0437\u043C\u0456\u043D\u044E\u044E\u0442\u044C \u0433\u043E\u043B\u043E\u0441\u043D\u0443 \u043A\u043E\u0440\u0435\u043D\u044F, \u0430\u043B\u0435 \u043B\u0438\u0448\u0435 \u0434\u043B\u044F du \u0456 er / sie / es:
- a / au \u2192 \xE4 / \xE4u: schlafen \u2192 du schl\xE4fst, er schl\xE4ft; laufen \u2192 du l\xE4ufst
- e \u2192 i: sprechen \u2192 du sprichst; essen \u2192 du isst; vergessen \u2192 du vergisst
- e \u2192 ie: lesen \u2192 du liest, er liest
- ich, wir, ihr, Sie / sie \u2014 \u0431\u0435\u0437 \u0437\u043C\u0456\u043D: ich schlafe, ihr schlaft.

# wissen \u2014 \u0437\u043D\u0430\u0442\u0438
\u041E\u0441\u043E\u0431\u043B\u0438\u0432\u0435 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E: ich wei\xDF, du wei\xDFt, er wei\xDF (\u0431\u0435\u0437 -t!), wir wissen, ihr wisst.
- Ich wei\xDF nicht. \u2014 \u042F \u043D\u0435 \u0437\u043D\u0430\u044E.

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F \u0439 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
- Schl\xE4fst du? \u2014 \u0422\u0438 \u0441\u043F\u0438\u0448?
- Er liest nicht. \u2014 \u0412\u0456\u043D \u043D\u0435 \u0447\u0438\u0442\u0430\u0454.`,pl:`# \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430
\u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F \u0442\u0456 \u0441\u0430\u043C\u0456, \u0449\u043E \u0432 \u0443\u0440\u043E\u0446\u0456 1, \u0430\u043B\u0435 \u043E\u0441\u043D\u043E\u0432\u0430 \u043C\u043E\u0436\u0435 \u0437\u043C\u0456\u043D\u044E\u0432\u0430\u0442\u0438\u0441\u044F:
- spa\u0107 \u2192 \u015Bpi\u0119, \u015Bpisz, \u015Bpi\u0105
- je\u015B\u0107 \u2192 jem, jesz, je, jedz\u0105
- wiedzie\u0107 \u2192 wiem, wiesz, wie, wiedz\u0105
- pi\u0107 \u2192 pij\u0119; pisa\u0107 \u2192 pisz\u0119 (s \u2192 sz)
- -a\u0107 \u2192 -am: czytam, p\u0142ywam, zaczynam, latam

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F \u0439 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
- Czy ty \u015Bpisz? \u2014 \u0422\u0438 \u0441\u043F\u0438\u0448?
- Ona nie k\u0142amie. \u2014 \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435.`,es:`# \u0417\u043C\u0456\u043D\u0430 \u043A\u043E\u0440\u0435\u043D\u044F
\u0423 \u043D\u0430\u0433\u043E\u043B\u043E\u0448\u0435\u043D\u0438\u0445 \u0444\u043E\u0440\u043C\u0430\u0445 \u0433\u043E\u043B\u043E\u0441\u043D\u0430 \u043A\u043E\u0440\u0435\u043D\u044F \u0437\u043C\u0456\u043D\u044E\u0454\u0442\u044C\u0441\u044F (\u043A\u0440\u0456\u043C nosotros \u0456 vosotros):
- o \u2192 ue: dormir \u2192 duermo, volar \u2192 vuelo
- e \u2192 ie: entender \u2192 entiendo, empezar \u2192 empiezo, mentir \u2192 miento
- nosotros / vosotros \u2014 \u0431\u0435\u0437 \u0437\u043C\u0456\u043D: dormimos, entend\xE9is.

# \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0430 \u0444\u043E\u0440\u043C\u0430 \xAB\u044F\xBB
- saber \u2192 s\xE9 (\u044F \u0437\u043D\u0430\u044E), venir \u2192 vengo, \u0430\u043B\u0435 t\xFA vienes

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F \u0439 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
- \xBFDuermes t\xFA? \u2014 \u0422\u0438 \u0441\u043F\u0438\u0448?
- Yo no s\xE9. \u2014 \u042F \u043D\u0435 \u0437\u043D\u0430\u044E.`,fr:`# \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430
\u041E\u0434\u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0430 \u0434\u043B\u044F je / tu / il, \u0456\u043D\u0448\u0430 \u2014 \u0434\u043B\u044F nous / vous, \u0449\u0435 \u0456\u043D\u0448\u0430 \u0434\u043B\u044F ils:
- boire \u2192 je bois, nous buvons, ils boivent
- venir \u2192 je viens, nous venons, ils viennent
- \xE9crire \u2192 j'\xE9cris, nous \xE9crivons; lire \u2192 je lis, nous lisons
- dormir \u2192 je dors, nous dormons; savoir \u2192 je sais, nous savons
- manger \u2192 nous mangeons, commencer \u2192 nous commen\xE7ons (\u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0454\u043C\u043E \u043C'\u044F\u043A\u0438\u0439 \u0437\u0432\u0443\u043A)

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F \u0439 \u0437\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
- Est-ce que tu dors\xA0? \u2014 \u0422\u0438 \u0441\u043F\u0438\u0448?
- Il ne ment pas. \u2014 \u0412\u0456\u043D \u043D\u0435 \u0431\u0440\u0435\u0448\u0435.`},hn={en:`# Irregular verbs
In the present tense English verbs are almost all regular: he / she adds -s.
They are irregular in the past (slept, ate, wrote) \u2014 that comes in later lessons.
- fly \u2192 he flies (consonant + y \u2192 ies)

# Questions and negation
As in lesson 1:
- Do you sleep? Does he swim? She doesn't lie.`,uk:`# Irregular verbs
Many common verbs change their stem:
- \u0441\u043F\u0430\u0442\u0438 \u2192 \u0441\u043F\u043B\u044E, \u0441\u043F\u0438\u0448, \u0441\u043F\u043B\u044F\u0442\u044C
- \u0457\u0441\u0442\u0438 \u2192 \u0457\u043C, \u0457\u0441\u0438, \u0457\u0441\u0442\u044C, \u0457\u043C\u043E, \u0457\u0441\u0442\u0435, \u0457\u0434\u044F\u0442\u044C
- \u043F\u0438\u0441\u0430\u0442\u0438 \u2192 \u043F\u0438\u0448\u0443, \u043F\u0438\u0448\u0435\u0448 (\u0441 \u2192 \u0448); \u0431\u0456\u0433\u0430\u0442\u0438 \u2192 \u0431\u0456\u0433\u0430\u044E

# Questions and negation
- \u0422\u0438 \u0441\u043F\u0438\u0448? \u2014 Do you sleep?
- \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435. \u2014 She doesn't lie.`,de:`# Stem change
Many strong verbs change the stem vowel, but only for du and er / sie / es:
- a / au \u2192 \xE4 / \xE4u: schlafen \u2192 du schl\xE4fst, er schl\xE4ft; laufen \u2192 du l\xE4ufst
- e \u2192 i: sprechen \u2192 du sprichst; essen \u2192 du isst; vergessen \u2192 du vergisst
- e \u2192 ie: lesen \u2192 du liest, er liest
- ich, wir, ihr, Sie / sie \u2014 unchanged: ich schlafe, ihr schlaft.

# wissen \u2014 to know
A special verb: ich wei\xDF, du wei\xDFt, er wei\xDF (no -t!), wir wissen, ihr wisst.
- Ich wei\xDF nicht. \u2014 I don't know.

# Questions and negation
- Schl\xE4fst du? \u2014 Do you sleep?
- Er liest nicht. \u2014 He doesn't read.`,pl:`# Irregular verbs
The endings are the same as in lesson 1, but the stem can change:
- spa\u0107 \u2192 \u015Bpi\u0119, \u015Bpisz, \u015Bpi\u0105
- je\u015B\u0107 \u2192 jem, jesz, je, jedz\u0105
- wiedzie\u0107 \u2192 wiem, wiesz, wie, wiedz\u0105
- pi\u0107 \u2192 pij\u0119; pisa\u0107 \u2192 pisz\u0119 (s \u2192 sz)
- -a\u0107 \u2192 -am: czytam, p\u0142ywam, zaczynam, latam

# Questions and negation
- Czy ty \u015Bpisz? \u2014 Do you sleep?
- Ona nie k\u0142amie. \u2014 She doesn't lie.`,es:`# Stem change
In stressed forms the stem vowel changes (not in nosotros and vosotros):
- o \u2192 ue: dormir \u2192 duermo, volar \u2192 vuelo
- e \u2192 ie: entender \u2192 entiendo, empezar \u2192 empiezo, mentir \u2192 miento
- nosotros / vosotros \u2014 unchanged: dormimos, entend\xE9is.

# Irregular \xABI\xBB form
- saber \u2192 s\xE9 (I know), venir \u2192 vengo, but t\xFA vienes

# Questions and negation
- \xBFDuermes t\xFA? \u2014 Do you sleep?
- Yo no s\xE9. \u2014 I don't know.`,fr:`# Irregular verbs
One stem for je / tu / il, another for nous / vous, sometimes a third for ils:
- boire \u2192 je bois, nous buvons, ils boivent
- venir \u2192 je viens, nous venons, ils viennent
- \xE9crire \u2192 j'\xE9cris, nous \xE9crivons; lire \u2192 je lis, nous lisons
- dormir \u2192 je dors, nous dormons; savoir \u2192 je sais, nous savons
- manger \u2192 nous mangeons, commencer \u2192 nous commen\xE7ons (keeps the soft sound)

# Questions and negation
- Est-ce que tu dors\xA0? \u2014 Do you sleep?
- Il ne ment pas. \u2014 He doesn't lie.`},gn={en:`# \u041C\u0430\u0439\u0431\u0443\u0442\u043D\u0456\u0439 \u0447\u0430\u0441
will + \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E, \u043E\u0434\u043D\u0430\u043A\u043E\u0432\u043E \u0434\u043B\u044F \u0432\u0441\u0456\u0445 \u043E\u0441\u0456\u0431:
- I will help \u2014 \u044F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443; she will help \u2014 \u0432\u043E\u043D\u0430 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435
- \u041F\u0438\u0442\u0430\u043D\u043D\u044F: Will you help me? \u2014 \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456?
- \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F: I won't (= will not) help.

# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A-\u0434\u043E\u0434\u0430\u0442\u043E\u043A
\u041F\u0456\u0441\u043B\u044F \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430: me \u2014 \u043C\u0435\u043D\u0456, you \u2014 \u0442\u043E\u0431\u0456 / \u0432\u0430\u043C, us \u2014 \u043D\u0430\u043C.
- explain \u0456 write \u043F\u043E\u0442\u0440\u0435\u0431\u0443\u044E\u0442\u044C to: I will explain to you. \u2014 \u042F \u043F\u043E\u044F\u0441\u043D\u044E \u0442\u043E\u0431\u0456.`,de:`# \u041C\u0430\u0439\u0431\u0443\u0442\u043D\u0456\u0439 \u0447\u0430\u0441 (Futur I)
werden + \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432 \u0443 \u043A\u0456\u043D\u0446\u0456 \u0440\u0435\u0447\u0435\u043D\u043D\u044F:
- ich werde, du wirst, er / sie wird, wir werden, ihr werdet, Sie / sie werden
- Ich werde helfen. \u2014 \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443.

# \u0414\u0430\u0432\u0430\u043B\u044C\u043D\u0438\u0439 \u0432\u0456\u0434\u043C\u0456\u043D\u043E\u043A (Dativ)
mir \u2014 \u043C\u0435\u043D\u0456, dir \u2014 \u0442\u043E\u0431\u0456, uns \u2014 \u043D\u0430\u043C, euch \u2014 \u0432\u0430\u043C. \u0421\u0442\u043E\u0457\u0442\u044C \u043F\u0456\u0441\u043B\u044F werden:
- Ich werde dir helfen. \u2014 \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456.
- \u041F\u0438\u0442\u0430\u043D\u043D\u044F: Wirst du mir helfen? \u2014 \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456?
- \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F: Er wird uns nicht helfen. \u2014 nicht \u043F\u0435\u0440\u0435\u0434 \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432\u043E\u043C.`,pl:`# \u041C\u0430\u0439\u0431\u0443\u0442\u043D\u0456\u0439 \u0447\u0430\u0441
\u0414\u043E\u043A\u043E\u043D\u0430\u043D\u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430 \u043C\u0430\u044E\u0442\u044C \u043F\u0440\u043E\u0441\u0442\u0443 \u0444\u043E\u0440\u043C\u0443 \u043C\u0430\u0439\u0431\u0443\u0442\u043D\u044C\u043E\u0433\u043E \u2014 \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F \u044F\u043A \u0443 \u0442\u0435\u043F\u0435\u0440\u0456\u0448\u043D\u044C\u043E\u043C\u0443:
- pom\xF3c \u2192 pomog\u0119, pomo\u017Cesz, pomo\u017Ce, pomog\u0105
- powiedzie\u0107 \u2192 powiem, powiesz, powie, powiedz\u0105

# \u0414\u0430\u0432\u0430\u043B\u044C\u043D\u0438\u0439 \u0432\u0456\u0434\u043C\u0456\u043D\u043E\u043A
mi \u2014 \u043C\u0435\u043D\u0456, ci \u2014 \u0442\u043E\u0431\u0456, nam \u2014 \u043D\u0430\u043C, wam \u2014 \u0432\u0430\u043C. \u041A\u043E\u0440\u043E\u0442\u043A\u0438\u0439 \u0437\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u043D\u0435 \u0441\u0442\u043E\u0457\u0442\u044C \u043F\u0435\u0440\u0448\u0438\u043C \u0443 \u0440\u0435\u0447\u0435\u043D\u043D\u0456:
- Ja ci pomog\u0119. / Pomog\u0119 ci. \u2014 \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456.
- Czy ty mi pomo\u017Cesz? \u2014 \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456?
- On nam nie pomo\u017Ce. \u2014 \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C.`,es:`# \u041C\u0430\u0439\u0431\u0443\u0442\u043D\u0456\u0439 \u0447\u0430\u0441
\u0414\u043E \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432\u0430 \u0434\u043E\u0434\u0430\u0454\u043C\u043E -\xE9, -\xE1s, -\xE1, -emos, -\xE9is, -\xE1n:
- ayudar \u2192 ayudar\xE9, ayudar\xE1s, ayudar\xE1, ayudaremos, ayudar\xE9is, ayudar\xE1n
- \u041D\u0435\u043F\u0440\u0430\u0432\u0438\u043B\u044C\u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0430: decir \u2192 dir\xE9.

# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A-\u0434\u043E\u0434\u0430\u0442\u043E\u043A
me \u2014 \u043C\u0435\u043D\u0456, te \u2014 \u0442\u043E\u0431\u0456, nos \u2014 \u043D\u0430\u043C, os \u2014 \u0432\u0430\u043C. \u0421\u0442\u043E\u0457\u0442\u044C \u043F\u0435\u0440\u0435\u0434 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E\u043C:

# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A-\u0434\u043E\u0434\u0430\u0442\u043E\u043A
me \u2014 \u043C\u0435\u043D\u0456, te \u2014 \u0442\u043E\u0431\u0456, nous \u2014 \u043D\u0430\u043C, vous \u2014 \u0432\u0430\u043C. \u0421\u0442\u043E\u0457\u0442\u044C \u043F\u0435\u0440\u0435\u0434 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E\u043C, \u043F\u0435\u0440\u0435\u0434 \u0433\u043E\u043B\u043E\u0441\u043D\u043E\u044E \u2014 m' / t':
- Je t'aiderai. \u2014 \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456.
- Est-ce que tu me diras\xA0? \u2014 \u0422\u0438 \u0441\u043A\u0430\u0436\u0435\u0448 \u043C\u0435\u043D\u0456?
- Il ne nous aidera pas. \u2014 ne \u2026 pas \u043E\u0431\u0440\u0430\u043C\u043B\u044E\u044E\u0442\u044C \u0437\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u0456 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E.`},yn={en:`# Future tense
will + verb, the same for every person:
- I will help, she will help
- Question: Will you help me?
- Negation: I won't (= will not) help.

# Object pronouns
After the verb: me, you, us, you (plural).
- explain and write take to: I will explain to you.`,uk:`# Future tense
Perfective verbs form a simple future with present-tense endings:
- \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0442\u0438 \u2192 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443\u0442\u044C
- \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u0438 \u2192 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0438, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u044C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u044F\u0442\u044C

# Dative pronouns
\u043C\u0435\u043D\u0456 \u2014 (to) me, \u0442\u043E\u0431\u0456 \u2014 (to) you, \u043D\u0430\u043C \u2014 (to) us, \u0432\u0430\u043C \u2014 (to) you (plural):
- \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456. / \u042F \u0442\u043E\u0431\u0456 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443. \u2014 I will help you.
- \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456? \u2014 Will you help me?
- \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C. \u2014 He won't help us.`,de:`# Future tense (Futur I)
werden + the infinitive at the end:
- ich werde, du wirst, er / sie wird, wir werden, ihr werdet, Sie / sie werden
- Ich werde helfen. \u2014 I will help.

# Dative pronouns
mir \u2014 (to) me, dir \u2014 (to) you, uns \u2014 (to) us, euch \u2014 (to) you (plural). They follow werden:
- Ich werde dir helfen. \u2014 I will help you.
- Question: Wirst du mir helfen? \u2014 Will you help me?
- Negation: Er wird uns nicht helfen. \u2014 nicht goes before the infinitive.`,pl:`# Future tense
Perfective verbs form a simple future with present-tense endings:
- pom\xF3c \u2192 pomog\u0119, pomo\u017Cesz, pomo\u017Ce, pomog\u0105
- powiedzie\u0107 \u2192 powiem, powiesz, powie, powiedz\u0105

# Dative pronouns
mi \u2014 (to) me, ci \u2014 (to) you, nam \u2014 (to) us, wam \u2014 (to) you (plural). A short pronoun never opens the sentence:
- Ja ci pomog\u0119. / Pomog\u0119 ci. \u2014 I will help you.
- Czy ty mi pomo\u017Cesz? \u2014 Will you help me?
- On nam nie pomo\u017Ce. \u2014 He won't help us.`,es:`# Future tense
Add -\xE9, -\xE1s, -\xE1, -emos, -\xE9is, -\xE1n to the infinitive:
- ayudar \u2192 ayudar\xE9, ayudar\xE1s, ayudar\xE1, ayudaremos, ayudar\xE9is, ayudar\xE1n
- Irregular stem: decir \u2192 dir\xE9.

# Object pronouns
me \u2014 (to) me, te \u2014 (to) you, nos \u2014 (to) us, os \u2014 (to) you (plural). They go before the verb:
- Yo te ayudar\xE9. \u2014 I will help you.
- \xBFT\xFA me ayudar\xE1s? \u2014 Will you help me?
- \xC9l no nos ayudar\xE1. \u2014 He won't help us.`,fr:`# Future tense (futur simple)
Add -ai, -as, -a, -ons, -ez, -ont to the infinitive (-re verbs drop the e):
- aider \u2192 j'aiderai, tu aideras, il aidera, nous aiderons, vous aiderez, ils aideront
- r\xE9pondre \u2192 je r\xE9pondrai; dire \u2192 je dirai

# Object pronouns
me \u2014 (to) me, te \u2014 (to) you, nous \u2014 (to) us, vous \u2014 (to) you. They go before the verb; m' / t' before a vowel:
- Je t'aiderai. \u2014 I will help you.
- Est-ce que tu me diras\xA0? \u2014 Will you tell me?
- Il ne nous aidera pas. \u2014 ne \u2026 pas wrap the pronoun and the verb.`},ht={1:{uk:un,en:pn,de:tt,pl:rt,es:lt,fr:ut},2:{uk:mn,en:hn,de:nt,pl:ot,es:ct,fr:pt},3:{uk:gn,en:yn,de:it,pl:at,es:dt,fr:mt}};function ge(e,t){try{let s=localStorage.getItem(e);return s?JSON.parse(s):t}catch{return t}}function We(e,t){try{localStorage.setItem(e,JSON.stringify(t))}catch{}}var he=e=>{try{return localStorage.getItem(e)!=="0"}catch{return!0}},gt=(e,t)=>{try{localStorage.setItem(e,t?"1":"0")}catch{}},_=()=>{let e=ge("lt_lang","en"),t=Xe();return t.some(s=>s.id===e)?e:t[0].id},V=1;function us(e,t=V){let s=ge(xe(e,t),null);return s&&Array.isArray(s.buf)&&s.buf.length===100&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<100?s:je()}var cs=e=>e.charAt(0).toUpperCase()+e.slice(1),D=(e,t,s,n,r=32,i=l.eel)=>z(e,t,s,n,r,i).setOrigin(0,.5),F=(e,t)=>e.setScale(Math.min(1,t/e.width)),ie=(e,t,s,n,r,i)=>e.add.zone(t,s,n,r).setInteractive({useHandCursor:!0}).on("pointerup",i);function Ae(e,t,s,n,r,i=44,o=l.wolf){let c=I(e,t,s,n,i,o);return ie(e,s,n,88,88,r),c}function qe(e,t,s){Ae(e,"back",52,64,s),e.input.keyboard?.on("keydown-ESC",s),t&&F(z(e,d/2,64,t,36),d-220)}function vt(e,t,s,n,r=24){e.add.circle(t,s,r,n===null?l.swan:n>=Se?l.macaw:l.fox),n===null?I(e,"lock",t,s,r,l.hare):z(e,t,s,n.toFixed(1),Math.round(r*.72),l.snow)}var Fe=class extends Phaser.Scene{constructor(){super("menu")}create(){let t=_();z(this,d/2,70,w().appTitle,48),Ae(this,"gear",d-56,70,()=>this.scene.start("settings"),48);let s=Xe();s.forEach((i,o)=>k(this,d/2+(o-(s.length-1)/2)*128,160,116,68,i.name,()=>{We("lt_lang",i.id),this.scene.restart()},i.id===t?"blue":"secondary",{size:28}));let n=222,r=66;w().topics.forEach((i,o)=>{let c=n+o*r+r/2,a=ye.find(u=>u===o+1);o&&this.add.rectangle(d/2,n+o*r,d-48,2,l.swan),vt(this,60,c,a?q(us(t,a)):null),D(this,104,c-14,w().lesson(o+1),28,a?l.eel:l.hare),F(D(this,104,c+16,i,22,l.wolf),d-128),ie(this,d/2,c,d,r,()=>{if(!a){M(this,w().soon,1600,x-170);return}V=a,this.scene.start("lesson")})}),
