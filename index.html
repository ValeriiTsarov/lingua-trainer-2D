- \u044F \u2014 ich, \u0442\u0438 \u2014 du, \u0432\u0456\u043D \u2014 er, \u0432\u043E\u043D\u0430 \u2014 sie, \u0432\u043E\u043D\u043E \u2014 es
- \u043C\u0438 \u2014 wir, \u0432\u0438 \u2014 ihr, \u0412\u0438 \u2014 Sie (h\xF6flich), \u0432\u043E\u043D\u0438 \u2014 sie (Plural)
- Das Pronomen kann wegfallen: \u0416\u0438\u0432\u0443. = \u042F \u0436\u0438\u0432\u0443.

# Pr\xE4sens
Zwei Konjugationsmuster:
- \u0436\u0438\u0442\u0438: \u0436\u0438\u0432\u0443, \u0436\u0438\u0432\u0435\u0448, \u0436\u0438\u0432\u0435, \u0436\u0438\u0432\u0435\u043C\u043E, \u0436\u0438\u0432\u0435\u0442\u0435, \u0436\u0438\u0432\u0443\u0442\u044C
- \u043B\u044E\u0431\u0438\u0442\u0438: \u043B\u044E\u0431\u043B\u044E, \u043B\u044E\u0431\u0438\u0448, \u043B\u044E\u0431\u0438\u0442\u044C, \u043B\u044E\u0431\u0438\u043C\u043E, \u043B\u044E\u0431\u0438\u0442\u0435, \u043B\u044E\u0431\u043B\u044F\u0442\u044C

# Fragen
Die Wortstellung bleibt gleich \u2014 nur Intonation und \u201E?\u201C (oder \u0447\u0438 am Anfang):
- \u0422\u0438 \u0436\u0438\u0432\u0435\u0448? / \u0427\u0438 \u0442\u0438 \u0436\u0438\u0432\u0435\u0448? \u2014 Lebst du?

# Verneinung
\u043D\u0435 steht vor dem Verb:
- \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E. \u2014 Ich frage nicht.`,en:`# Personalpronomen
- I \u2014 ich, you \u2014 du, he \u2014 er, she \u2014 sie, it \u2014 es
- we \u2014 wir, you \u2014 ihr, they \u2014 sie (Plural)
- \u201Eyou\u201C steht f\xFCr du, ihr und Sie \u2014 eine eigene H\xF6flichkeitsform gibt es nicht.

# Pr\xE4sens (Present Simple)
Das Verb \xE4ndert sich kaum. Nur bei he / she / it kommt die Endung -s dazu:
- I live \u2014 ich lebe; he lives \u2014 er lebt
- nach -sh, -ch, -ss, -x, -o schreibt man -es: she watches, he does
- I, you, we, they \u2014 immer ohne Endung: we wait, they love

# Fragen
Am Anfang steht do, bei he / she \u2014 does. Das Verb selbst steht ohne -s:
- Do you live? \u2014 Lebst du?
- Does she wait? \u2014 Wartet sie?
- Do they believe? \u2014 Glauben sie?

# Verneinung
Nach dem Pronomen steht don't (= do not), bei he / she \u2014 doesn't (= does not). Verb ohne -s:
- I don't ask. \u2014 Ich frage nicht.
- He doesn't believe. \u2014 Er glaubt nicht.

# Beispiel mit Gru\xDF
- I say "Hello"! \u2014 Ich sage \u201EHallo\u201C!
- Does he say "Good morning"? \u2014 Sagt er \u201EGuten Morgen\u201C?`,pl:`# Personalpronomen
- ja \u2014 ich, ty \u2014 du, on \u2014 er, ona \u2014 sie, ono \u2014 es
- my \u2014 wir, wy \u2014 ihr, oni / one \u2014 sie (Plural)
- H\xF6flich: Pan (zu einem Mann), Pani (zu einer Frau) + Verb in der 3. Person: Pan czeka.
- Das Pronomen f\xE4llt oft weg: Czekam. = Ja czekam.

# Endungen
Die zwei h\xE4ufigsten Muster im Pr\xE4sens:
- -am: czekam, czekasz, czeka, czekamy, czekacie, czekaj\u0105
- -\u0119: robi\u0119, robisz, robi, robimy, robicie, robi\u0105
- -owa\u0107 \u2192 -uj\u0119: podr\xF3\u017Cuj\u0119, podr\xF3\u017Cujesz, podr\xF3\u017Cuje \u2026
- uczy\u0107 si\u0119 ist reflexiv: ucz\u0119 si\u0119, uczysz si\u0119, uczy si\u0119 \u2026

# Fragen
Am Anfang steht die Partikel czy (oder nur die Intonation):
- Czy ty czekasz? \u2014 Wartest du?
- Czy Pan wierzy? \u2014 Glauben Sie?
- Czy oni s\u0142ysz\u0105? \u2014 H\xF6ren sie?

# Verneinung
nie steht vor dem Verb:
- Ja nie pytam. \u2014 Ich frage nicht.
- Ona nie kocha. \u2014 Sie liebt nicht.`,es:`# Personalpronomen
- yo \u2014 ich, t\xFA \u2014 du, \xE9l \u2014 er, ella \u2014 sie
- nosotros / nosotras \u2014 wir, vosotros / vosotras \u2014 ihr
- ellos / ellas \u2014 sie (Plural)
- usted \u2014 Sie (h\xF6flich), Verb in der 3. Person Singular: usted vive.
- Das Pronomen wird meist weggelassen: Vivo. = Yo vivo.

# Endungen
Drei Gruppen nach dem Infinitiv:
- -ar (esperar): espero, esperas, espera, esperamos, esper\xE1is, esperan
- -er (aprender): aprendo, aprendes, aprende, aprendemos, aprend\xE9is, aprenden
- -ir (vivir): vivo, vives, vive, vivimos, viv\xEDs, viven
- Unregelm\xE4\xDFig: hacer \u2192 hago, decir \u2192 digo, o\xEDr \u2192 oigo, mostrar \u2192 muestro, sentir \u2192 siento.

# Fragen
\xBF \u2026 ? stehen auf beiden Seiten; das Verb kommt oft zuerst:
- \xBFVives t\xFA? oder \xBFT\xFA vives? \u2014 Lebst du?
- \xBFEspera usted? \u2014 Warten Sie?

# Verneinung
no steht vor dem Verb:
- Yo no espero. \u2014 Ich warte nicht.
- Ellos no creen. \u2014 Sie glauben nicht.`,fr:`# Personalpronomen
- je (j' vor Vokal) \u2014 ich, tu \u2014 du, il \u2014 er, elle \u2014 sie
- nous \u2014 wir, vous \u2014 ihr und Sie (h\xF6flich), ils / elles \u2014 sie (Plural)

# Endungen
Verben auf -er (aimer):
- j'aime, tu aimes, il / elle aime
- nous aimons, vous aimez, ils / elles aiment
- -e, -es, -ent werden nicht gesprochen: aime, aimes, aiment klingen gleich.
- Andere Gruppen: attendre \u2192 j'attends, il attend; croire \u2192 je crois, nous croyons.
- Unregelm\xE4\xDFig: faire \u2192 je fais, vous faites, ils font; dire \u2192 vous dites.

# Fragen
- Est-ce que am Anfang: Est-ce que tu attends\xA0? \u2014 Wartest du?
- Vor Vokal \u2014 est-ce qu': Est-ce qu'il croit\xA0?
- Umgangssprachlich \u2014 nur mit Intonation: Tu attends\xA0?
- Im Franz\xF6sischen steht vor ? und ! ein Leerzeichen.

# Verneinung
ne \u2026 pas umschlie\xDFen das Verb (n' vor Vokal):
- Je ne demande pas. \u2014 Ich frage nicht.
- Il n'aime pas. \u2014 Er liebt nicht.`},nt={uk:`# Unregelm\xE4\xDFige Verben
Viele h\xE4ufige Verben \xE4ndern ihren Stamm:
- \u0441\u043F\u0430\u0442\u0438 \u2192 \u0441\u043F\u043B\u044E, \u0441\u043F\u0438\u0448, \u0441\u043F\u043B\u044F\u0442\u044C
- \u0457\u0441\u0442\u0438 \u2192 \u0457\u043C, \u0457\u0441\u0438, \u0457\u0441\u0442\u044C, \u0457\u043C\u043E, \u0457\u0441\u0442\u0435, \u0457\u0434\u044F\u0442\u044C
- \u043F\u0438\u0441\u0430\u0442\u0438 \u2192 \u043F\u0438\u0448\u0443, \u043F\u0438\u0448\u0435\u0448 (\u0441 \u2192 \u0448); \u0431\u0456\u0433\u0430\u0442\u0438 \u2192 \u0431\u0456\u0433\u0430\u044E

# Fragen und Verneinung
- \u0422\u0438 \u0441\u043F\u0438\u0448? \u2014 Schl\xE4fst du?
- \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435. \u2014 Sie l\xFCgt nicht.`,en:`# Unregelm\xE4\xDFige Verben
Im Pr\xE4sens sind englische Verben fast alle \u201Eregelm\xE4\xDFig\u201C: he / she bekommt -s.
Unregelm\xE4\xDFig sind sie in der Vergangenheit (slept, ate, wrote) \u2014 das kommt in sp\xE4teren Lektionen.
- fly \u2192 he flies (y nach Konsonant \u2192 ies)
- I know \u2014 ich wei\xDF; she knows \u2014 sie wei\xDF

# Fragen und Verneinung
Genauso wie in Lektion 1:
- Do you sleep? \u2014 Schl\xE4fst du?
- Does he swim? \u2014 Schwimmt er?
- She doesn't lie. \u2014 Sie l\xFCgt nicht.`,pl:`# Unregelm\xE4\xDFige Verben
Die Endungen sind dieselben wie in Lektion 1, aber der Stamm kann sich \xE4ndern:
- spa\u0107 \u2192 \u015Bpi\u0119, \u015Bpisz, \u015Bpi\u0105
- je\u015B\u0107 \u2192 jem, jesz, je, jedz\u0105
- wiedzie\u0107 \u2192 wiem, wiesz, wie, wiedz\u0105
- pi\u0107 \u2192 pij\u0119; pisa\u0107 \u2192 pisz\u0119 (s \u2192 sz)
- -a\u0107 \u2192 -am: czytam, p\u0142ywam, zaczynam, latam

# Fragen und Verneinung
- Czy ty \u015Bpisz? \u2014 Schl\xE4fst du?
- Ona nie k\u0142amie. \u2014 Sie l\xFCgt nicht.`,es:`# Stammvokalwechsel
In betonten Formen \xE4ndert sich der Stammvokal (au\xDFer bei nosotros und vosotros):
- o \u2192 ue: dormir \u2192 duermo, volar \u2192 vuelo
- e \u2192 ie: entender \u2192 entiendo, empezar \u2192 empiezo, mentir \u2192 miento
- nosotros / vosotros \u2014 unver\xE4ndert: dormimos, entend\xE9is.

# Unregelm\xE4\xDFige Ich-Form
- saber \u2192 s\xE9 (ich wei\xDF), venir \u2192 vengo, aber t\xFA vienes

# Fragen und Verneinung
- \xBFDuermes t\xFA? \u2014 Schl\xE4fst du?
- Yo no s\xE9. \u2014 Ich wei\xDF nicht.`,fr:`# Unregelm\xE4\xDFige Verben
Ein Stamm f\xFCr je / tu / il, ein anderer f\xFCr nous / vous, manchmal ein dritter f\xFCr ils:
- boire \u2192 je bois, nous buvons, ils boivent
- venir \u2192 je viens, nous venons, ils viennent
- \xE9crire \u2192 j'\xE9cris, nous \xE9crivons; lire \u2192 je lis, nous lisons
- dormir \u2192 je dors, nous dormons; savoir \u2192 je sais, nous savons
- manger \u2192 nous mangeons, commencer \u2192 nous commen\xE7ons (der weiche Laut bleibt)

# Fragen und Verneinung
- Est-ce que tu dors\xA0? \u2014 Schl\xE4fst du?
- Il ne ment pas. \u2014 Er l\xFCgt nicht.`},it={uk:`# Futur
Perfektive Verben bilden ein einfaches Futur mit den Endungen des Pr\xE4sens:
- \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0442\u0438 \u2192 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443\u0442\u044C
- \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u0438 \u2192 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0438, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u044C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u044F\u0442\u044C

# Dativpronomen
\u043C\u0435\u043D\u0456 \u2014 mir, \u0442\u043E\u0431\u0456 \u2014 dir, \u043D\u0430\u043C \u2014 uns, \u0432\u0430\u043C \u2014 euch / Ihnen:
- \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456. / \u042F \u0442\u043E\u0431\u0456 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443. \u2014 Ich werde dir helfen.
- \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456? \u2014 Wirst du mir helfen?
- \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C. \u2014 Er wird uns nicht helfen.`,en:`# Futur (will)
will + Verb, f\xFCr alle Personen gleich:
- I will help \u2014 ich werde helfen; she will help \u2014 sie wird helfen
- Frage: Will you help me? \u2014 Wirst du mir helfen?
- Verneinung: I won't (= will not) help.

# Objektpronomen
Nach dem Verb: me \u2014 mir, you \u2014 dir / euch / Ihnen, us \u2014 uns.
- explain und write brauchen to: I will explain to you. \u2014 Ich werde es dir erkl\xE4ren.`,pl:`# Futur
Perfektive Verben bilden ein einfaches Futur \u2014 mit den Endungen des Pr\xE4sens:
- pom\xF3c \u2192 pomog\u0119, pomo\u017Cesz, pomo\u017Ce, pomog\u0105
- powiedzie\u0107 \u2192 powiem, powiesz, powie, powiedz\u0105

# Dativ
mi \u2014 mir, ci \u2014 dir, nam \u2014 uns, wam \u2014 euch. Ein kurzes Pronomen steht nie am Satzanfang:
- Ja ci pomog\u0119. / Pomog\u0119 ci. \u2014 Ich werde dir helfen.
- Czy ty mi pomo\u017Cesz? \u2014 Wirst du mir helfen?
- On nam nie pomo\u017Ce. \u2014 Er wird uns nicht helfen.`,es:`# Futur
An den Infinitiv kommen -\xE9, -\xE1s, -\xE1, -emos, -\xE9is, -\xE1n:
- ayudar \u2192 ayudar\xE9, ayudar\xE1s, ayudar\xE1, ayudaremos, ayudar\xE9is, ayudar\xE1n
- Unregelm\xE4\xDFiger Stamm: decir \u2192 dir\xE9.

# Objektpronomen
me \u2014 mir, te \u2014 dir, nos \u2014 uns, os \u2014 euch. Sie stehen vor dem Verb:
- Yo te ayudar\xE9. \u2014 Ich werde dir helfen.
- \xBFT\xFA me ayudar\xE1s? \u2014 Wirst du mir helfen?
- \xC9l no nos ayudar\xE1. \u2014 Er wird uns nicht helfen.`,fr:`# Futur (futur simple)
An den Infinitiv kommen -ai, -as, -a, -ons, -ez, -ont (bei -re f\xE4llt das e weg):
- aider \u2192 j'aiderai, tu aideras, il aidera, nous aiderons, vous aiderez, ils aideront
- r\xE9pondre \u2192 je r\xE9pondrai; dire \u2192 je dirai

# Objektpronomen
me \u2014 mir, te \u2014 dir, nous \u2014 uns, vous \u2014 euch / Ihnen. Sie stehen vor dem Verb, vor Vokal \u2014 m' / t':
- Je t'aiderai. \u2014 Ich werde dir helfen.
- Est-ce que tu me diras\xA0? \u2014 Wirst du es mir sagen?
- Il ne nous aidera pas. \u2014 ne \u2026 pas umschlie\xDFen Pronomen und Verb.`};var rt={uk:`# Zaimki osobowe
- \u044F \u2014 ja, \u0442\u0438 \u2014 ty, \u0432\u0456\u043D \u2014 on, \u0432\u043E\u043D\u0430 \u2014 ona, \u0432\u043E\u043D\u043E \u2014 ono
- \u043C\u0438 \u2014 my, \u0432\u0438 \u2014 wy, \u0432\u043E\u043D\u0438 \u2014 oni / one
- \u0412\u0438 \u2014 forma grzeczno\u015Bciowa (Pan / Pani), czasownik w 2. os. l.mn.: \u0412\u0438 \u0436\u0438\u0432\u0435\u0442\u0435.
- Zaimek mo\u017Cna pomin\u0105\u0107, jak po polsku: \u0416\u0438\u0432\u0443. = \u042F \u0436\u0438\u0432\u0443.

# Czas tera\u017Aniejszy
Dwa wzory odmiany:
- \u0436\u0438\u0442\u0438: \u0436\u0438\u0432\u0443, \u0436\u0438\u0432\u0435\u0448, \u0436\u0438\u0432\u0435, \u0436\u0438\u0432\u0435\u043C\u043E, \u0436\u0438\u0432\u0435\u0442\u0435, \u0436\u0438\u0432\u0443\u0442\u044C
- \u043B\u044E\u0431\u0438\u0442\u0438: \u043B\u044E\u0431\u043B\u044E, \u043B\u044E\u0431\u0438\u0448, \u043B\u044E\u0431\u0438\u0442\u044C, \u043B\u044E\u0431\u0438\u043C\u043E, \u043B\u044E\u0431\u0438\u0442\u0435, \u043B\u044E\u0431\u043B\u044F\u0442\u044C

# Pytania
Szyk si\u0119 nie zmienia \u2014 tylko intonacja i \xAB?\xBB (albo \u0447\u0438 na pocz\u0105tku, jak polskie czy):
- \u0422\u0438 \u0436\u0438\u0432\u0435\u0448? / \u0427\u0438 \u0442\u0438 \u0436\u0438\u0432\u0435\u0448? \u2014 Czy ty \u017Cyjesz?

# Przeczenie
\u043D\u0435 stoi przed czasownikiem, jak polskie nie:
- \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E. \u2014 Nie pytam.`,en:`# Zaimki osobowe
- I \u2014 ja, you \u2014 ty, he \u2014 on, she \u2014 ona, it \u2014 ono
- we \u2014 my, you \u2014 wy, they \u2014 oni / one
- \xAByou\xBB to jednocze\u015Bnie ty, wy i Pan / Pani \u2014 osobnej formy grzeczno\u015Bciowej nie ma.
- Zaimka nie pomijamy: I wait \u2014 czekam.

# Czas tera\u017Aniejszy (Present Simple)
Czasownik prawie si\u0119 nie zmienia. Tylko po he / she / it dodajemy ko\u0144c\xF3wk\u0119 -s:
- I live \u2014 \u017Cyj\u0119; he lives \u2014 on \u017Cyje
- po -sh, -ch, -ss, -x, -o piszemy -es: she watches, he does
- I, you, we, they \u2014 zawsze bez ko\u0144c\xF3wki: we wait, they love

# Pytania
Na pocz\u0105tku stawiamy do, a dla he / she \u2014 does. Sam czasownik jest bez -s:
- Do you live? \u2014 Czy ty \u017Cyjesz?
- Does she wait? \u2014 Czy ona czeka?
- Do they believe? \u2014 Czy oni wierz\u0105?

# Przeczenie
Po zaimku \u2014 don't (= do not), dla he / she \u2014 doesn't (= does not). Czasownik bez -s:
- I don't ask. \u2014 Nie pytam.
- He doesn't believe. \u2014 On nie wierzy.

# Przyk\u0142ad z powitaniem
- I say "Hello"! \u2014 M\xF3wi\u0119 \u201ECze\u015B\u0107\u201D!
- Does he say "Good morning"? \u2014 Czy on m\xF3wi \u201EDzie\u0144 dobry\u201D?`,de:`# Zaimki osobowe
- ich \u2014 ja, du \u2014 ty, er \u2014 on, sie \u2014 ona, es \u2014 ono
- wir \u2014 my, ihr \u2014 wy, sie \u2014 oni / one
- Sie \u2014 Pan / Pani / Pa\u0144stwo: zawsze wielk\u0105 liter\u0105, czasownik jak przy sie (oni).

# Ko\u0144c\xF3wki
Od bezokolicznika odrzucamy -en i dodajemy ko\u0144c\xF3wk\u0119: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- Temat na -d / -t \u2014 wtr\u0105cone e: du wartest, er wartet.
- Temat na -s / -\xDF / -z \u2014 przy du tylko -t: du reist.
- Bezokolicznik na -eln: ich sammle, ale du sammelst.

# Pytania
Czasownik staje na pierwszym miejscu, zaimek tu\u017C po nim:
- Lebst du? \u2014 Czy ty \u017Cyjesz?
- Warten Sie? \u2014 Czy Pan / Pani czeka?
- H\xF6rt ihr? \u2014 Czy wy s\u0142yszycie?

# Przeczenie
nicht stoi po czasowniku, na ko\u0144cu kr\xF3tkiego zdania:
- Ich lerne nicht. \u2014 Nie ucz\u0119 si\u0119.
- Sie glauben nicht. \u2014 Oni nie wierz\u0105.
- Z dope\u0142nieniem: Er sagt nicht Hallo. (w \u0107wiczeniach przyjmujemy te\u017C Er sagt Hallo nicht.)`,es:`# Zaimki osobowe
- yo \u2014 ja, t\xFA \u2014 ty, \xE9l \u2014 on, ella \u2014 ona
- nosotros / nosotras \u2014 my, vosotros / vosotras \u2014 wy
- ellos / ellas \u2014 oni / one
- usted \u2014 Pan / Pani, czasownik w 3. os. l.poj., jak po polsku: usted vive.
- Zaimek zwykle si\u0119 pomija: Vivo. = Yo vivo.

# Ko\u0144c\xF3wki
Trzy grupy wed\u0142ug bezokolicznika:
- -ar (esperar): espero, esperas, espera, esperamos, esper\xE1is, esperan
- -er (aprender): aprendo, aprendes, aprende, aprendemos, aprend\xE9is, aprenden
- -ir (vivir): vivo, vives, vive, vivimos, viv\xEDs, viven
- Nieregularne: hacer \u2192 hago, decir \u2192 digo, o\xEDr \u2192 oigo, mostrar \u2192 muestro, sentir \u2192 siento.

# Pytania
Znaki \xBF \u2026 ? stawiamy z obu stron; czasownik cz\u0119sto idzie pierwszy:
- \xBFVives t\xFA? lub \xBFT\xFA vives? \u2014 Czy ty \u017Cyjesz?
- \xBFEspera usted? \u2014 Czy Pan / Pani czeka?

# Przeczenie
no stoi przed czasownikiem:
- Yo no espero. \u2014 Nie czekam.
- Ellos no creen. \u2014 Oni nie wierz\u0105.`,fr:`# Zaimki osobowe
- je (j' przed samog\u0142osk\u0105) \u2014 ja, tu \u2014 ty, il \u2014 on, elle \u2014 ona
- nous \u2014 my, vous \u2014 wy oraz Pan / Pani / Pa\u0144stwo, ils / elles \u2014 oni / one

# Ko\u0144c\xF3wki
Czasowniki na -er (aimer):
- j'aime, tu aimes, il / elle aime
- nous aimons, vous aimez, ils / elles aiment
- -e, -es, -ent s\u0105 nieme: aime, aimes, aiment brzmi\u0105 tak samo.
- Inne grupy: attendre \u2192 j'attends, il attend; croire \u2192 je crois, nous croyons.
- Nieregularne: faire \u2192 je fais, vous faites, ils font; dire \u2192 vous dites.

# Pytania
- Est-ce que na pocz\u0105tku: Est-ce que tu attends\xA0? \u2014 Czy ty czekasz?
- Przed samog\u0142osk\u0105 \u2014 est-ce qu': Est-ce qu'il croit\xA0?
- Potocznie \u2014 sam\u0105 intonacj\u0105: Tu attends\xA0?
- Po francusku przed ? i ! stawiamy spacj\u0119.

# Przeczenie
ne \u2026 pas otaczaj\u0105 czasownik (n' przed samog\u0142osk\u0105):
- Je ne demande pas. \u2014 Nie pytam.
- Il n'aime pas. \u2014 On nie kocha.`},ot={uk:`# Czasowniki nieregularne
Wiele cz\u0119stych czasownik\xF3w zmienia temat:
- \u0441\u043F\u0430\u0442\u0438 \u2192 \u0441\u043F\u043B\u044E, \u0441\u043F\u0438\u0448, \u0441\u043F\u043B\u044F\u0442\u044C
- \u0457\u0441\u0442\u0438 \u2192 \u0457\u043C, \u0457\u0441\u0438, \u0457\u0441\u0442\u044C, \u0457\u043C\u043E, \u0457\u0441\u0442\u0435, \u0457\u0434\u044F\u0442\u044C
- \u043F\u0438\u0441\u0430\u0442\u0438 \u2192 \u043F\u0438\u0448\u0443, \u043F\u0438\u0448\u0435\u0448 (\u0441 \u2192 \u0448, jak pisa\u0107 \u2192 pisz\u0119); \u0431\u0456\u0433\u0430\u0442\u0438 \u2192 \u0431\u0456\u0433\u0430\u044E

# Pytania i przeczenie
- \u0422\u0438 \u0441\u043F\u0438\u0448? \u2014 Czy ty \u015Bpisz?
- \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435. \u2014 Ona nie k\u0142amie.`,en:`# Czasowniki nieregularne
W czasie tera\u017Aniejszym angielskie czasowniki s\u0105 prawie wszystkie \u201Eregularne\u201D: he / she dodaje -s.
Nieregularne s\u0105 w czasie przesz\u0142ym (slept, ate, wrote) \u2014 o tym w kolejnych lekcjach.
- fly \u2192 he flies (y po sp\xF3\u0142g\u0142osce \u2192 ies)
- I know \u2014 wiem; she knows \u2014 ona wie

# Pytania i przeczenie
Tak samo jak w lekcji 1:
- Do you sleep? \u2014 Czy ty \u015Bpisz?
- Does he swim? \u2014 Czy on p\u0142ywa?
- She doesn't lie. \u2014 Ona nie k\u0142amie.`,de:`# Oboczno\u015B\u0107 w temacie
Wiele czasownik\xF3w mocnych zmienia samog\u0142osk\u0119 tematu, ale tylko przy du i er / sie / es:
- a / au \u2192 \xE4 / \xE4u: schlafen \u2192 du schl\xE4fst, er schl\xE4ft; laufen \u2192 du l\xE4ufst
- e \u2192 i: sprechen \u2192 du sprichst; essen \u2192 du isst; vergessen \u2192 du vergisst
- e \u2192 ie: lesen \u2192 du liest, er liest
- ich, wir, ihr, Sie / sie \u2014 bez zmian: ich schlafe, ihr schlaft.

# wissen \u2014 wiedzie\u0107
Wyj\u0105tkowy czasownik: ich wei\xDF, du wei\xDFt, er wei\xDF (bez -t!), wir wissen, ihr wisst.
- Ich wei\xDF nicht. \u2014 Nie wiem.

# Pytania i przeczenie
- Schl\xE4fst du? \u2014 Czy ty \u015Bpisz?
- Er liest nicht. \u2014 On nie czyta.`,es:`# Oboczno\u015B\u0107 w temacie
W formach akcentowanych samog\u0142oska tematu si\u0119 zmienia (opr\xF3cz nosotros i vosotros):
- o \u2192 ue: dormir \u2192 duermo, volar \u2192 vuelo
- e \u2192 ie: entender \u2192 entiendo, empezar \u2192 empiezo, mentir \u2192 miento
- nosotros / vosotros \u2014 bez zmian: dormimos, entend\xE9is.

# Nieregularna forma \u201Eja\u201D
- saber \u2192 s\xE9 (wiem), venir \u2192 vengo, ale t\xFA vienes

# Pytania i przeczenie
- \xBFDuermes t\xFA? \u2014 Czy ty \u015Bpisz?
- Yo no s\xE9. \u2014 Nie wiem.`,fr:`# Czasowniki nieregularne
Jeden temat dla je / tu / il, inny dla nous / vous, czasem jeszcze inny dla ils:
- boire \u2192 je bois, nous buvons, ils boivent
- venir \u2192 je viens, nous venons, ils viennent
- \xE9crire \u2192 j'\xE9cris, nous \xE9crivons; lire \u2192 je lis, nous lisons
- dormir \u2192 je dors, nous dormons; savoir \u2192 je sais, nous savons
- manger \u2192 nous mangeons, commencer \u2192 nous commen\xE7ons (zachowujemy mi\u0119kk\u0105 wymow\u0119)

# Pytania i przeczenie
- Est-ce que tu dors\xA0? \u2014 Czy ty \u015Bpisz?
- Il ne ment pas. \u2014 On nie k\u0142amie.`},at={uk:`# Czas przysz\u0142y
Czasowniki dokonane tworz\u0105 czas przysz\u0142y prosty z ko\u0144c\xF3wkami tera\u017Aniejszymi \u2014 jak po polsku:
- \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0442\u0438 \u2192 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443\u0442\u044C
- \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u0438 \u2192 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0438, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u044C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u044F\u0442\u044C

# Zaimki w celowniku
\u043C\u0435\u043D\u0456 \u2014 mi, \u0442\u043E\u0431\u0456 \u2014 ci, \u043D\u0430\u043C \u2014 nam, \u0432\u0430\u043C \u2014 wam:
- \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456. / \u042F \u0442\u043E\u0431\u0456 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443. \u2014 Pomog\u0119 ci.
- \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456? \u2014 Czy mi pomo\u017Cesz?
- \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C. \u2014 On nam nie pomo\u017Ce.`,en:`# Czas przysz\u0142y
will + czasownik, tak samo dla wszystkich os\xF3b:
- I will help \u2014 pomog\u0119; she will help \u2014 ona pomo\u017Ce
- Pytanie: Will you help me? \u2014 Czy mi pomo\u017Cesz?
- Przeczenie: I won't (= will not) help.

# Zaimek jako dope\u0142nienie
Po czasowniku: me \u2014 mi, you \u2014 ci / wam, us \u2014 nam.
- explain i write wymagaj\u0105 to: I will explain to you. \u2014 Wyja\u015Bni\u0119 ci.`,de:`# Czas przysz\u0142y (Futur I)
werden + bezokolicznik na ko\u0144cu zdania:
- ich werde, du wirst, er / sie wird, wir werden, ihr werdet, Sie / sie werden
- Ich werde helfen. \u2014 Pomog\u0119.

# Celownik (Dativ)
mir \u2014 mi, dir \u2014 ci, uns \u2014 nam, euch \u2014 wam. Stoj\u0105 po werden:
- Ich werde dir helfen. \u2014 Pomog\u0119 ci.
- Pytanie: Wirst du mir helfen? \u2014 Czy mi pomo\u017Cesz?
- Przeczenie: Er wird uns nicht helfen. \u2014 nicht przed bezokolicznikiem.`,es:`# Czas przysz\u0142y
Do bezokolicznika dodajemy -\xE9, -\xE1s, -\xE1, -emos, -\xE9is, -\xE1n:
- ayudar \u2192 ayudar\xE9, ayudar\xE1s, ayudar\xE1, ayudaremos, ayudar\xE9is, ayudar\xE1n
- Nieregularny temat: decir \u2192 dir\xE9.

# Zaimki jako dope\u0142nienie
me \u2014 mi, te \u2014 ci, nos \u2014 nam, os \u2014 wam. Stoj\u0105 przed czasownikiem:
- Yo te ayudar\xE9. \u2014 Pomog\u0119 ci.
- \xBFT\xFA me ayudar\xE1s? \u2014 Czy mi pomo\u017Cesz?
- \xC9l no nos ayudar\xE1. \u2014 On nam nie pomo\u017Ce.`,fr:`# Czas przysz\u0142y (futur simple)
Do bezokolicznika dodajemy -ai, -as, -a, -ons, -ez, -ont (w czasownikach na -re znika e):
- aider \u2192 j'aiderai, tu aideras, il aidera, nous aiderons, vous aiderez, ils aideront
- r\xE9pondre \u2192 je r\xE9pondrai; dire \u2192 je dirai

# Zaimki jako dope\u0142nienie
me \u2014 mi, te \u2014 ci, nous \u2014 nam, vous \u2014 wam. Stoj\u0105 przed czasownikiem, przed samog\u0142osk\u0105 \u2014 m' / t':
- Je t'aiderai. \u2014 Pomog\u0119 ci.
- Est-ce que tu me diras\xA0? \u2014 Czy mi powiesz?
- Il ne nous aidera pas. \u2014 ne \u2026 pas otaczaj\u0105 zaimek i czasownik.`};var lt={en:`# Pronombres
- I \u2014 yo, you \u2014 t\xFA, he \u2014 \xE9l, she \u2014 ella, it \u2014 (cosas y animales)
- we \u2014 nosotros, you \u2014 vosotros / ustedes, they \u2014 ellos / ellas
- \xAByou\xBB sirve para t\xFA, vosotros, usted y ustedes: no hay forma de cortes\xEDa aparte.
- El pronombre no se omite: \xABVivo\xBB es I live, nunca solo live.

# Presente (Present Simple)
El verbo casi no cambia. Solo con he / she / it se a\xF1ade la terminaci\xF3n -s:
- I live \u2014 yo vivo; he lives \u2014 \xE9l vive
- tras -sh, -ch, -ss, -x, -o se escribe -es: she watches, he does
- I, you, we, they \u2014 siempre sin terminaci\xF3n: we wait, they love

# Preguntas
Al principio va do; con he / she, does. El verbo va sin -s:
- Do you live? \u2014 \xBFVives t\xFA?
- Does she wait? \u2014 \xBFEspera ella?
- Do they believe? \u2014 \xBFCreen ellos?

# Negaci\xF3n
Tras el pronombre va don't (= do not); con he / she, doesn't (= does not). El verbo va sin -s:
- I don't ask. \u2014 Yo no pregunto.
- He doesn't believe. \u2014 \xC9l no cree.

# Ejemplo con saludo
- I say "Hello"! \u2014 \xA1Digo \xABHola\xBB!
- Does he say "Good morning"? \u2014 \xBF\xC9l dice \xABBuenos d\xEDas\xBB?`,uk:`# Pronombres
- \u044F \u2014 yo, \u0442\u0438 \u2014 t\xFA, \u0432\u0456\u043D \u2014 \xE9l, \u0432\u043E\u043D\u0430 \u2014 ella, \u0432\u043E\u043D\u043E \u2014 (neutro)
- \u043C\u0438 \u2014 nosotros, \u0432\u0438 \u2014 vosotros, \u0412\u0438 \u2014 usted / ustedes, \u0432\u043E\u043D\u0438 \u2014 ellos / ellas
- El pronombre se puede omitir, como en espa\xF1ol: \u0416\u0438\u0432\u0443. = \u042F \u0436\u0438\u0432\u0443.

# Presente
Dos modelos de conjugaci\xF3n:
- \u0436\u0438\u0442\u0438 (vivir): \u0436\u0438\u0432\u0443, \u0436\u0438\u0432\u0435\u0448, \u0436\u0438\u0432\u0435, \u0436\u0438\u0432\u0435\u043C\u043E, \u0436\u0438\u0432\u0435\u0442\u0435, \u0436\u0438\u0432\u0443\u0442\u044C
- \u043B\u044E\u0431\u0438\u0442\u0438 (amar): \u043B\u044E\u0431\u043B\u044E, \u043B\u044E\u0431\u0438\u0448, \u043B\u044E\u0431\u0438\u0442\u044C, \u043B\u044E\u0431\u0438\u043C\u043E, \u043B\u044E\u0431\u0438\u0442\u0435, \u043B\u044E\u0431\u043B\u044F\u0442\u044C

# Preguntas
El orden no cambia: solo la entonaci\xF3n y \xAB?\xBB (o \u0447\u0438 al principio):
- \u0422\u0438 \u0436\u0438\u0432\u0435\u0448? / \u0427\u0438 \u0442\u0438 \u0436\u0438\u0432\u0435\u0448? \u2014 \xBFVives t\xFA?

# Negaci\xF3n
\u043D\u0435 va delante del verbo, como no en espa\xF1ol:
- \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E. \u2014 Yo no pregunto.`,de:`# Pronombres
- ich \u2014 yo, du \u2014 t\xFA, er \u2014 \xE9l, sie \u2014 ella, es \u2014 (neutro)
- wir \u2014 nosotros, ihr \u2014 vosotros, sie \u2014 ellos / ellas
- Sie \u2014 usted / ustedes: siempre con may\xFAscula, el verbo va como con sie (ellos).

# Terminaciones
Se quita -en al infinitivo y se a\xF1ade la terminaci\xF3n: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- Ra\xEDz en -d / -t: se intercala una e: du wartest, er wartet.
- Ra\xEDz en -s / -\xDF / -z: con du solo -t: du reist.
- Infinitivo en -eln: ich sammle, pero du sammelst.

# Preguntas
El verbo va en primer lugar y el pronombre justo despu\xE9s:
- Lebst du? \u2014 \xBFVives t\xFA?
- Warten Sie? \u2014 \xBFEspera usted?
- H\xF6rt ihr? \u2014 \xBFO\xEDs vosotros?

# Negaci\xF3n
nicht va despu\xE9s del verbo, al final de una frase corta:
- Ich lerne nicht. \u2014 Yo no aprendo.
- Sie glauben nicht. \u2014 Ellos no creen.
- Con complemento: Er sagt nicht Hallo. (en los ejercicios tambi\xE9n vale Er sagt Hallo nicht.)`,pl:`# Pronombres
- ja \u2014 yo, ty \u2014 t\xFA, on \u2014 \xE9l, ona \u2014 ella, ono \u2014 (neutro)
- my \u2014 nosotros, wy \u2014 vosotros, oni / one \u2014 ellos / ellas
- Cortes\xEDa: Pan (a un hombre), Pani (a una mujer) + verbo en 3.\xAA persona: Pan czeka.
- El pronombre se suele omitir, como en espa\xF1ol: Czekam. = Ja czekam.

# Terminaciones
Los dos modelos m\xE1s frecuentes del presente:
- -am: czekam, czekasz, czeka, czekamy, czekacie, czekaj\u0105
- -\u0119: robi\u0119, robisz, robi, robimy, robicie, robi\u0105
- -owa\u0107 \u2192 -uj\u0119: podr\xF3\u017Cuj\u0119, podr\xF3\u017Cujesz, podr\xF3\u017Cuje \u2026
- uczy\u0107 si\u0119 es reflexivo: ucz\u0119 si\u0119, uczysz si\u0119, uczy si\u0119 \u2026

# Preguntas
Al principio va la part\xEDcula czy (o basta la entonaci\xF3n):
- Czy ty czekasz? \u2014 \xBFEsperas t\xFA?
- Czy Pan wierzy? \u2014 \xBFCree usted?
- Czy oni s\u0142ysz\u0105? \u2014 \xBFOyen ellos?

# Negaci\xF3n
nie va delante del verbo, como no en espa\xF1ol:
- Ja nie pytam. \u2014 Yo no pregunto.
- Ona nie kocha. \u2014 Ella no ama.`,fr:`# Pronombres
- je (j' ante vocal) \u2014 yo, tu \u2014 t\xFA, il \u2014 \xE9l, elle \u2014 ella
- nous \u2014 nosotros, vous \u2014 vosotros y usted / ustedes, ils / elles \u2014 ellos / ellas

# Terminaciones
Verbos en -er (aimer):
- j'aime, tu aimes, il / elle aime
- nous aimons, vous aimez, ils / elles aiment
- -e, -es, -ent no se pronuncian: aime, aimes, aiment suenan igual.
- Otros grupos: attendre \u2192 j'attends, il attend; croire \u2192 je crois, nous croyons.
- Irregulares: faire \u2192 je fais, vous faites, ils font; dire \u2192 vous dites.

# Preguntas
- Est-ce que al principio: Est-ce que tu attends\xA0? \u2014 \xBFEsperas t\xFA?
- Ante vocal, est-ce qu': Est-ce qu'il croit\xA0?
- En lenguaje coloquial, solo con la entonaci\xF3n: Tu attends\xA0?
- En franc\xE9s se pone un espacio antes de ? y !.

# Negaci\xF3n
ne \u2026 pas rodean el verbo (n' ante vocal):
- Je ne demande pas. \u2014 Yo no pregunto.
- Il n'aime pas. \u2014 \xC9l no ama.`},ct={en:`# Verbos irregulares
En presente casi todos los verbos ingleses son \xABregulares\xBB: con he / she se a\xF1ade -s.
Son irregulares en pasado (slept, ate, wrote); eso llegar\xE1 en lecciones posteriores.
- fly \u2192 he flies (consonante + y \u2192 ies)
- I know \u2014 yo s\xE9; she knows \u2014 ella sabe

# Preguntas y negaci\xF3n
Igual que en la lecci\xF3n 1:
- Do you sleep? \u2014 \xBFDuermes t\xFA?
- Does he swim? \u2014 \xBFNada \xE9l?
- She doesn't lie. \u2014 Ella no miente.`,uk:`# Verbos irregulares
Muchos verbos frecuentes cambian la ra\xEDz:
- \u0441\u043F\u0430\u0442\u0438 (dormir) \u2192 \u0441\u043F\u043B\u044E, \u0441\u043F\u0438\u0448, \u0441\u043F\u043B\u044F\u0442\u044C
- \u0457\u0441\u0442\u0438 (comer) \u2192 \u0457\u043C, \u0457\u0441\u0438, \u0457\u0441\u0442\u044C, \u0457\u043C\u043E, \u0457\u0441\u0442\u0435, \u0457\u0434\u044F\u0442\u044C
- \u043F\u0438\u0441\u0430\u0442\u0438 (escribir) \u2192 \u043F\u0438\u0448\u0443, \u043F\u0438\u0448\u0435\u0448 (\u0441 \u2192 \u0448); \u0431\u0456\u0433\u0430\u0442\u0438 (correr) \u2192 \u0431\u0456\u0433\u0430\u044E

# Preguntas y negaci\xF3n
- \u0422\u0438 \u0441\u043F\u0438\u0448? \u2014 \xBFDuermes t\xFA?
- \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435. \u2014 Ella no miente.`,de:`# Cambio voc\xE1lico
Muchos verbos fuertes cambian la vocal de la ra\xEDz, pero solo con du y er / sie / es:
- a / au \u2192 \xE4 / \xE4u: schlafen \u2192 du schl\xE4fst, er schl\xE4ft; laufen \u2192 du l\xE4ufst
- e \u2192 i: sprechen \u2192 du sprichst; essen \u2192 du isst; vergessen \u2192 du vergisst
- e \u2192 ie: lesen \u2192 du liest, er liest
- ich, wir, ihr, Sie / sie \u2014 sin cambios: ich schlafe, ihr schlaft.

# wissen \u2014 saber
Verbo especial: ich wei\xDF, du wei\xDFt, er wei\xDF (\xA1sin -t!), wir wissen, ihr wisst.
- Ich wei\xDF nicht. \u2014 Yo no s\xE9.

# Preguntas y negaci\xF3n
- Schl\xE4fst du? \u2014 \xBFDuermes t\xFA?
- Er liest nicht. \u2014 \xC9l no lee.`,pl:`# Verbos irregulares
Las terminaciones son las de la lecci\xF3n 1, pero la ra\xEDz puede cambiar:
- spa\u0107 \u2192 \u015Bpi\u0119, \u015Bpisz, \u015Bpi\u0105
- je\u015B\u0107 \u2192 jem, jesz, je, jedz\u0105
- wiedzie\u0107 \u2192 wiem, wiesz, wie, wiedz\u0105
- pi\u0107 \u2192 pij\u0119; pisa\u0107 \u2192 pisz\u0119 (s \u2192 sz)
- -a\u0107 \u2192 -am: czytam, p\u0142ywam, zaczynam, latam

# Preguntas y negaci\xF3n
- Czy ty \u015Bpisz? \u2014 \xBFDuermes t\xFA?
- Ona nie k\u0142amie. \u2014 Ella no miente.`,fr:`# Verbos irregulares
Una ra\xEDz para je / tu / il, otra para nous / vous y, a veces, una tercera para ils:
- boire \u2192 je bois, nous buvons, ils boivent
- venir \u2192 je viens, nous venons, ils viennent
- \xE9crire \u2192 j'\xE9cris, nous \xE9crivons; lire \u2192 je lis, nous lisons
- dormir \u2192 je dors, nous dormons; savoir \u2192 je sais, nous savons
- manger \u2192 nous mangeons, commencer \u2192 nous commen\xE7ons (se mantiene el sonido suave)

# Preguntas y negaci\xF3n
- Est-ce que tu dors\xA0? \u2014 \xBFDuermes t\xFA?
- Il ne ment pas. \u2014 \xC9l no miente.`},dt={en:`# Futuro
will + verbo, igual para todas las personas:
- I will help \u2014 yo ayudar\xE9; she will help \u2014 ella ayudar\xE1
- Pregunta: Will you help me? \u2014 \xBFMe ayudar\xE1s?
- Negaci\xF3n: I won't (= will not) help.

# Pronombre de complemento
Va despu\xE9s del verbo: me \u2014 me, you \u2014 te / os / le / les, us \u2014 nos.
- explain y write llevan to: I will explain to you. \u2014 Te lo explicar\xE9.`,uk:`# Futuro
Los verbos perfectivos forman un futuro simple con las terminaciones del presente:
- \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0442\u0438 (ayudar) \u2192 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443\u0442\u044C
- \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u0438 (responder) \u2192 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0438, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u044C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u044F\u0442\u044C

# Pronombres en dativo
\u043C\u0435\u043D\u0456 \u2014 me (a m\xED), \u0442\u043E\u0431\u0456 \u2014 te (a ti), \u043D\u0430\u043C \u2014 nos (a nosotros), \u0432\u0430\u043C \u2014 os (a vosotros):
- \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456. / \u042F \u0442\u043E\u0431\u0456 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443. \u2014 Te ayudar\xE9.
- \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456? \u2014 \xBFMe ayudar\xE1s?
- \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C. \u2014 \xC9l no nos ayudar\xE1.`,de:`# Futuro (Futur I)
werden + infinitivo al final de la frase:
- ich werde, du wirst, er / sie wird, wir werden, ihr werdet, Sie / sie werden
- Ich werde helfen. \u2014 Ayudar\xE9.

# Dativo
mir \u2014 me, dir \u2014 te, uns \u2014 nos, euch \u2014 os. Va despu\xE9s de werden:
- Ich werde dir helfen. \u2014 Te ayudar\xE9.
- Pregunta: Wirst du mir helfen? \u2014 \xBFMe ayudar\xE1s?
- Negaci\xF3n: Er wird uns nicht helfen. \u2014 nicht va delante del infinitivo.`,pl:`# Futuro
Los verbos perfectivos tienen un futuro simple con las terminaciones del presente:
- pom\xF3c \u2192 pomog\u0119, pomo\u017Cesz, pomo\u017Ce, pomog\u0105
- powiedzie\u0107 \u2192 powiem, powiesz, powie, powiedz\u0105

# Dativo
mi \u2014 me, ci \u2014 te, nam \u2014 nos, wam \u2014 os. El pronombre corto nunca abre la frase:
- Ja ci pomog\u0119. / Pomog\u0119 ci. \u2014 Te ayudar\xE9.
- Czy ty mi pomo\u017Cesz? \u2014 \xBFMe ayudar\xE1s?
- On nam nie pomo\u017Ce. \u2014 \xC9l no nos ayudar\xE1.`,fr:`# Futuro (futur simple)
Al infinitivo se a\xF1ade -ai, -as, -a, -ons, -ez, -ont (los verbos en -re pierden la e):
- aider \u2192 j'aiderai, tu aideras, il aidera, nous aiderons, vous aiderez, ils aideront
- r\xE9pondre \u2192 je r\xE9pondrai; dire \u2192 je dirai

# Pronombre de complemento
me \u2014 me, te \u2014 te, nous \u2014 nos, vous \u2014 os / le / les. Va delante del verbo, como en espa\xF1ol; ante vocal, m' / t':
- Je t'aiderai. \u2014 Te ayudar\xE9.
- Est-ce que tu me diras\xA0? \u2014 \xBFMe lo dir\xE1s?
- Il ne nous aidera pas. \u2014 ne \u2026 pas rodean el pronombre y el verbo.`};var ut={uk:`# Pronoms personnels
- \u044F \u2014 je, \u0442\u0438 \u2014 tu, \u0432\u0456\u043D \u2014 il, \u0432\u043E\u043D\u0430 \u2014 elle, \u0432\u043E\u043D\u043E \u2014 il (neutre)
- \u043C\u0438 \u2014 nous, \u0432\u0438 \u2014 vous (pluriel), \u0412\u0438 \u2014 vous (politesse), \u0432\u043E\u043D\u0438 \u2014 ils / elles
- Le pronom peut \xEAtre omis\xA0: \u0416\u0438\u0432\u0443. = \u042F \u0436\u0438\u0432\u0443.

# Pr\xE9sent
Deux mod\xE8les de conjugaison\xA0:
- \u0436\u0438\u0442\u0438\xA0: \u0436\u0438\u0432\u0443, \u0436\u0438\u0432\u0435\u0448, \u0436\u0438\u0432\u0435, \u0436\u0438\u0432\u0435\u043C\u043E, \u0436\u0438\u0432\u0435\u0442\u0435, \u0436\u0438\u0432\u0443\u0442\u044C
- \u043B\u044E\u0431\u0438\u0442\u0438\xA0: \u043B\u044E\u0431\u043B\u044E, \u043B\u044E\u0431\u0438\u0448, \u043B\u044E\u0431\u0438\u0442\u044C, \u043B\u044E\u0431\u0438\u043C\u043E, \u043B\u044E\u0431\u0438\u0442\u0435, \u043B\u044E\u0431\u043B\u044F\u0442\u044C

# Questions
L'ordre des mots ne change pas \u2014 seulement l'intonation et \xAB\xA0?\xA0\xBB (ou \u0447\u0438 en t\xEAte)\xA0:
- \u0422\u0438 \u0436\u0438\u0432\u0435\u0448? / \u0427\u0438 \u0442\u0438 \u0436\u0438\u0432\u0435\u0448? \u2014 Tu vis\xA0?

# N\xE9gation
\u043D\u0435 se place devant le verbe\xA0:
- \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E. \u2014 Je ne demande pas.`,en:`# Pronoms personnels
- I \u2014 je, you \u2014 tu, he \u2014 il, she \u2014 elle, it \u2014 il / elle (chose, animal)
- we \u2014 nous, you \u2014 vous (pluriel), they \u2014 ils / elles
- \xAB\xA0you\xA0\xBB couvre tu, vous (pluriel) et le vous de politesse\xA0: pas de forme de politesse \xE0 part.

# Pr\xE9sent (Present Simple)
Le verbe ne change presque pas. Seuls he / she / it prennent la terminaison -s\xA0:
- I live \u2014 je vis\xA0; he lives \u2014 il vit
- apr\xE8s -sh, -ch, -ss, -x, -o on \xE9crit -es\xA0: she watches, he does
- I, you, we, they \u2014 toujours sans terminaison\xA0: we wait, they love

# Questions
On place do en t\xEAte, does pour he / she. Le verbe reste sans -s\xA0:
- Do you live? \u2014 Tu vis\xA0?
- Does she wait? \u2014 Elle attend\xA0?
- Do they believe? \u2014 Ils croient\xA0?

# N\xE9gation
Apr\xE8s le pronom\xA0: don't (= do not), pour he / she\xA0: doesn't (= does not). Verbe sans -s\xA0:
- I don't ask. \u2014 Je ne demande pas.
- He doesn't believe. \u2014 Il ne croit pas.

# Exemple avec une salutation
- I say "Hello"! \u2014 Je dis \xAB\xA0Salut\xA0\xBB\xA0!
- Does he say "Good morning"? \u2014 Il dit \xAB\xA0Bonjour\xA0\xBB\xA0?`,de:`# Pronoms personnels
- ich \u2014 je, du \u2014 tu, er \u2014 il, sie \u2014 elle, es \u2014 il (neutre)
- wir \u2014 nous, ihr \u2014 vous (pluriel), sie \u2014 ils / elles
- Sie \u2014 vous (politesse)\xA0: toujours avec une majuscule, verbe comme avec sie (ils).

# Terminaisons
On retire -en de l'infinitif et on ajoute la terminaison\xA0: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- Radical en -d / -t \u2014 on intercale un e\xA0: du wartest, er wartet.
- Radical en -s / -\xDF / -z \u2014 du prend seulement -t\xA0: du reist.
- Infinitif en -eln\xA0: ich sammle, mais du sammelst.

# Questions
Le verbe passe en premi\xE8re position, le pronom juste apr\xE8s\xA0:
- Lebst du? \u2014 Tu vis\xA0?
- Warten Sie? \u2014 Vous attendez\xA0? (politesse)
- H\xF6rt ihr? \u2014 Vous entendez\xA0? (pluriel)

# N\xE9gation
nicht se place apr\xE8s le verbe, en fin de phrase courte\xA0:
- Ich lerne nicht. \u2014 Je n'apprends pas.
- Sie glauben nicht. \u2014 Ils ne croient pas.
- Avec un compl\xE9ment\xA0: Er sagt nicht Hallo. (Er sagt Hallo nicht. est aussi accept\xE9.)`,pl:`# Pronoms personnels
- ja \u2014 je, ty \u2014 tu, on \u2014 il, ona \u2014 elle, ono \u2014 il (neutre)
- my \u2014 nous, wy \u2014 vous (pluriel), oni / one \u2014 ils / elles
- Politesse\xA0: Pan (\xE0 un homme), Pani (\xE0 une femme) + verbe \xE0 la 3\u1D49 personne\xA0: Pan czeka.
- Le pronom est souvent omis\xA0: Czekam. = Ja czekam.

# Terminaisons
Les deux mod\xE8les les plus fr\xE9quents au pr\xE9sent\xA0:
- -am\xA0: czekam, czekasz, czeka, czekamy, czekacie, czekaj\u0105
- -\u0119\xA0: robi\u0119, robisz, robi, robimy, robicie, robi\u0105
- -owa\u0107 \u2192 -uj\u0119\xA0: podr\xF3\u017Cuj\u0119, podr\xF3\u017Cujesz, podr\xF3\u017Cuje \u2026
- uczy\u0107 si\u0119 est pronominal\xA0: ucz\u0119 si\u0119, uczysz si\u0119, uczy si\u0119 \u2026

# Questions
En t\xEAte, la particule czy (ou simplement l'intonation)\xA0:
- Czy ty czekasz? \u2014 Tu attends\xA0?
- Czy Pan wierzy? \u2014 Vous croyez\xA0? (politesse)
- Czy oni s\u0142ysz\u0105? \u2014 Ils entendent\xA0?

# N\xE9gation
nie se place devant le verbe\xA0:
- Ja nie pytam. \u2014 Je ne demande pas.
- Ona nie kocha. \u2014 Elle n'aime pas.`,es:`# Pronoms personnels
- yo \u2014 je, t\xFA \u2014 tu, \xE9l \u2014 il, ella \u2014 elle
- nosotros / nosotras \u2014 nous, vosotros / vosotras \u2014 vous (pluriel)
- ellos / ellas \u2014 ils / elles
- usted \u2014 vous (politesse), verbe \xE0 la 3\u1D49 personne du singulier\xA0: usted vive.
- Le pronom est g\xE9n\xE9ralement omis\xA0: Vivo. = Yo vivo.

# Terminaisons
Trois groupes selon l'infinitif\xA0:
- -ar (esperar)\xA0: espero, esperas, espera, esperamos, esper\xE1is, esperan
- -er (aprender)\xA0: aprendo, aprendes, aprende, aprendemos, aprend\xE9is, aprenden
- -ir (vivir)\xA0: vivo, vives, vive, vivimos, viv\xEDs, viven
- Irr\xE9guliers\xA0: hacer \u2192 hago, decir \u2192 digo, o\xEDr \u2192 oigo, mostrar \u2192 muestro, sentir \u2192 siento.

# Questions
Les signes \xBF \u2026 ? encadrent la phrase\xA0; le verbe vient souvent en premier\xA0:
- \xBFVives t\xFA? ou \xBFT\xFA vives? \u2014 Tu vis\xA0?
- \xBFEspera usted? \u2014 Vous attendez\xA0? (politesse)

# N\xE9gation
no se place devant le verbe\xA0:
- Yo no espero. \u2014 Je n'attends pas.
- Ellos no creen. \u2014 Ils ne croient pas.`},pt={uk:`# Verbes irr\xE9guliers
Beaucoup de verbes courants changent de radical\xA0:
- \u0441\u043F\u0430\u0442\u0438 \u2192 \u0441\u043F\u043B\u044E, \u0441\u043F\u0438\u0448, \u0441\u043F\u043B\u044F\u0442\u044C
- \u0457\u0441\u0442\u0438 \u2192 \u0457\u043C, \u0457\u0441\u0438, \u0457\u0441\u0442\u044C, \u0457\u043C\u043E, \u0457\u0441\u0442\u0435, \u0457\u0434\u044F\u0442\u044C
- \u043F\u0438\u0441\u0430\u0442\u0438 \u2192 \u043F\u0438\u0448\u0443, \u043F\u0438\u0448\u0435\u0448 (\u0441 \u2192 \u0448)\xA0; \u0431\u0456\u0433\u0430\u0442\u0438 \u2192 \u0431\u0456\u0433\u0430\u044E

# Questions et n\xE9gation
- \u0422\u0438 \u0441\u043F\u0438\u0448? \u2014 Tu dors\xA0?
- \u0412\u043E\u043D\u0430 \u043D\u0435 \u0431\u0440\u0435\u0448\u0435. \u2014 Elle ne ment pas.`,en:`# Verbes irr\xE9guliers
Au pr\xE9sent, presque tous les verbes anglais sont \xAB\xA0r\xE9guliers\xA0\xBB\xA0: he / she ajoute -s.
Ils sont irr\xE9guliers au pass\xE9 (slept, ate, wrote) \u2014 ce sera pour les le\xE7ons suivantes.
- fly \u2192 he flies (consonne + y \u2192 ies)
- I know \u2014 je sais\xA0; she knows \u2014 elle sait

# Questions et n\xE9gation
Comme dans la le\xE7on 1\xA0:
- Do you sleep? \u2014 Tu dors\xA0?
- Does he swim? \u2014 Il nage\xA0?
- She doesn't lie. \u2014 Elle ne ment pas.`,de:`# Changement de radical
Beaucoup de verbes forts changent la voyelle du radical, mais seulement avec du et er / sie / es\xA0:
- a / au \u2192 \xE4 / \xE4u\xA0: schlafen \u2192 du schl\xE4fst, er schl\xE4ft\xA0; laufen \u2192 du l\xE4ufst
- e \u2192 i\xA0: sprechen \u2192 du sprichst\xA0; essen \u2192 du isst\xA0; vergessen \u2192 du vergisst
- e \u2192 ie\xA0: lesen \u2192 du liest, er liest
- ich, wir, ihr, Sie / sie \u2014 sans changement\xA0: ich schlafe, ihr schlaft.

# wissen \u2014 savoir
Un verbe \xE0 part\xA0: ich wei\xDF, du wei\xDFt, er wei\xDF (sans -t\xA0!), wir wissen, ihr wisst.
- Ich wei\xDF nicht. \u2014 Je ne sais pas.

# Questions et n\xE9gation
- Schl\xE4fst du? \u2014 Tu dors\xA0?
- Er liest nicht. \u2014 Il ne lit pas.`,pl:`# Verbes irr\xE9guliers
Les terminaisons sont celles de la le\xE7on 1, mais le radical peut changer\xA0:
- spa\u0107 \u2192 \u015Bpi\u0119, \u015Bpisz, \u015Bpi\u0105
- je\u015B\u0107 \u2192 jem, jesz, je, jedz\u0105
- wiedzie\u0107 \u2192 wiem, wiesz, wie, wiedz\u0105
- pi\u0107 \u2192 pij\u0119\xA0; pisa\u0107 \u2192 pisz\u0119 (s \u2192 sz)
- -a\u0107 \u2192 -am\xA0: czytam, p\u0142ywam, zaczynam, latam

# Questions et n\xE9gation
- Czy ty \u015Bpisz? \u2014 Tu dors\xA0?
- Ona nie k\u0142amie. \u2014 Elle ne ment pas.`,es:`# Changement de radical
Quand le radical porte l'accent tonique, sa voyelle change (sauf nosotros et vosotros)\xA0:
- o \u2192 ue\xA0: dormir \u2192 duermo, volar \u2192 vuelo
- e \u2192 ie\xA0: entender \u2192 entiendo, empezar \u2192 empiezo, mentir \u2192 miento
- nosotros / vosotros \u2014 sans changement\xA0: dormimos, entend\xE9is.

# Forme irr\xE9guli\xE8re de \xAB\xA0je\xA0\xBB
- saber \u2192 s\xE9 (je sais), venir \u2192 vengo, mais t\xFA vienes

# Questions et n\xE9gation
- \xBFDuermes t\xFA? \u2014 Tu dors\xA0?
- Yo no s\xE9. \u2014 Je ne sais pas.`},mt={uk:`# Futur

- \u0434\u043E\u043F\u043E\u043C\u043E\u0433\u0442\u0438 \u2192 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435, \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443\u0442\u044C
- \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u0438 \u2192 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u043C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0438, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0441\u0442\u044C, \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u044F\u0442\u044C

# Pronoms au datif
\u043C\u0435\u043D\u0456 \u2014 me (\xE0 moi), \u0442\u043E\u0431\u0456 \u2014 te (\xE0 toi), \u043D\u0430\u043C \u2014 nous, \u0432\u0430\u043C \u2014 vous (pluriel)\xA0:
- \u042F \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443 \u0442\u043E\u0431\u0456. / \u042F \u0442\u043E\u0431\u0456 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0443. \u2014 Je t'aiderai.
- \u0422\u0438 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435\u0448 \u043C\u0435\u043D\u0456? \u2014 Tu m'aideras\xA0?
- \u0412\u0456\u043D \u043D\u0435 \u0434\u043E\u043F\u043E\u043C\u043E\u0436\u0435 \u043D\u0430\u043C. \u2014 Il ne nous aidera pas.`,en:`# Futur
will + verbe, identique \xE0 toutes les personnes\xA0:
- I will help \u2014 j'aiderai\xA0; she will help \u2014 elle aidera
- Question\xA0: Will you help me? \u2014 Tu m'aideras\xA0?
- N\xE9gation\xA0: I won't (= will not) help.

# Pronoms compl\xE9ments
Apr\xE8s le verbe\xA0: me \u2014 me / moi, you \u2014 te / vous, us \u2014 nous.
- explain et write demandent to\xA0: I will explain to you. \u2014 Je t'expliquerai.`,de:`# Futur (Futur I)
werden + infinitif en fin de phrase\xA0:
- ich werde, du wirst, er / sie wird, wir werden, ihr werdet, Sie / sie werden
- Ich werde helfen. \u2014 J'aiderai.

# Datif
mir \u2014 me (\xE0 moi), dir \u2014 te (\xE0 toi), uns \u2014 nous, euch \u2014 vous. Ils se placent apr\xE8s werden\xA0:
- Ich werde dir helfen. \u2014 Je t'aiderai.
- Question\xA0: Wirst du mir helfen? \u2014 Tu m'aideras\xA0?
- N\xE9gation\xA0: Er wird uns nicht helfen. \u2014 nicht devant l'infinitif.`,pl:`# Futur
Les verbes perfectifs forment un futur simple avec les terminaisons du pr\xE9sent\xA0:
- pom\xF3c \u2192 pomog\u0119, pomo\u017Cesz, pomo\u017Ce, pomog\u0105
- powiedzie\u0107 \u2192 powiem, powiesz, powie, powiedz\u0105

# Datif
mi \u2014 me (\xE0 moi), ci \u2014 te (\xE0 toi), nam \u2014 nous, wam \u2014 vous. Un pronom court n'ouvre jamais la phrase\xA0:
- Ja ci pomog\u0119. / Pomog\u0119 ci. \u2014 Je t'aiderai.
- Czy ty mi pomo\u017Cesz? \u2014 Tu m'aideras\xA0?
- On nam nie pomo\u017Ce. \u2014 Il ne nous aidera pas.`,es:`# Futur
On ajoute -\xE9, -\xE1s, -\xE1, -emos, -\xE9is, -\xE1n \xE0 l'infinitif\xA0:
- ayudar \u2192 ayudar\xE9, ayudar\xE1s, ayudar\xE1, ayudaremos, ayudar\xE9is, ayudar\xE1n
- Radical irr\xE9gulier\xA0: decir \u2192 dir\xE9.

# Pronoms compl\xE9ments
me \u2014 me, te \u2014 te, nos \u2014 nous, os \u2014 vous. Ils se placent devant le verbe\xA0:
- Yo te ayudar\xE9. \u2014 Je t'aiderai.
- \xBFT\xFA me ayudar\xE1s? \u2014 Tu m'aideras\xA0?
- \xC9l no nos ayudar\xE1. \u2014 Il ne nous aidera pas.`};var un={en:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- I \u2014 \u044F, you \u2014 \u0442\u0438, he \u2014 \u0432\u0456\u043D, she \u2014 \u0432\u043E\u043D\u0430, it \u2014 \u0432\u043E\u043D\u043E
- we \u2014 \u043C\u0438, you \u2014 \u0432\u0438 (\u043C\u043D.), they \u2014 \u0432\u043E\u043D\u0438
- \xAByou\xBB \u043E\u0434\u043D\u0435 \u043D\u0430 \xAB\u0442\u0438\xBB, \xAB\u0432\u0438\xBB \u0456 \u0432\u0432\u0456\u0447\u043B\u0438\u0432\u0435 \xAB\u0412\u0438\xBB \u2014 \u043E\u043A\u0440\u0435\u043C\u043E\u0457 \u0432\u0432\u0456\u0447\u043B\u0438\u0432\u043E\u0457 \u0444\u043E\u0440\u043C\u0438 \u043D\u0435\u043C\u0430\u0454.

# \u0422\u0435\u043F\u0435\u0440\u0456\u0448\u043D\u0456\u0439 \u0447\u0430\u0441 (Present Simple)
\u0414\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u043C\u0430\u0439\u0436\u0435 \u043D\u0435 \u0437\u043C\u0456\u043D\u044E\u0454\u0442\u044C\u0441\u044F. \u041B\u0438\u0448\u0435 \u043F\u0456\u0441\u043B\u044F he / she / it \u0434\u043E\u0434\u0430\u0454\u0442\u044C\u0441\u044F \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F -s:

- \u043F\u0456\u0441\u043B\u044F -sh, -ch, -ss, -x, -o \u043F\u0438\u0448\u0435\u043C\u043E -es: she watches, he does
- I, you, we, they \u2014 \u0437\u0430\u0432\u0436\u0434\u0438 \u0431\u0435\u0437 \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F: we wait, they love

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u041D\u0430 \u043F\u043E\u0447\u0430\u0442\u043E\u043A \u0441\u0442\u0430\u0432\u0438\u043C\u043E do, \u0430 \u0434\u043B\u044F he / she \u2014 does. \u0421\u0430\u043C\u0435 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0441\u0442\u043E\u0457\u0442\u044C \u0431\u0435\u0437 -s:

- Does she wait? \u2014 \u0412\u043E\u043D\u0430 \u0447\u0435\u043A\u0430\u0454?
- Do they believe? \u2014 \u0412\u043E\u043D\u0438 \u0432\u0456\u0440\u044F\u0442\u044C?

# \u041F\u0440\u0438\u043A\u043B\u0430\u0434 \u0437 \u043F\u0440\u0438\u0432\u0456\u0442\u0430\u043D\u043D\u044F\u043C
