# \u0422\u0435\u043F\u0435\u0440\u0456\u0448\u043D\u0456\u0439 \u0447\u0430\u0441 (Present Simple)
\u0414\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u043C\u0430\u0439\u0436\u0435 \u043D\u0435 \u0437\u043C\u0456\u043D\u044E\u0454\u0442\u044C\u0441\u044F. \u041B\u0438\u0448\u0435 \u043F\u0456\u0441\u043B\u044F he / she / it \u0434\u043E\u0434\u0430\u0454\u0442\u044C\u0441\u044F \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F -s:
- I live \u2014 \u044F \u0436\u0438\u0432\u0443; he lives \u2014 \u0432\u0456\u043D \u0436\u0438\u0432\u0435
- \u043F\u0456\u0441\u043B\u044F -sh, -ch, -ss, -x, -o \u043F\u0438\u0448\u0435\u043C\u043E -es: she watches, he does
- I, you, we, they \u2014 \u0437\u0430\u0432\u0436\u0434\u0438 \u0431\u0435\u0437 \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F: we wait, they love

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u041D\u0430 \u043F\u043E\u0447\u0430\u0442\u043E\u043A \u0441\u0442\u0430\u0432\u0438\u043C\u043E do, \u0430 \u0434\u043B\u044F he / she \u2014 does. \u0421\u0430\u043C\u0435 \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0441\u0442\u043E\u0457\u0442\u044C \u0431\u0435\u0437 -s:
- Do you live? \u2014 \u0422\u0438 \u0436\u0438\u0432\u0435\u0448?
- Does she wait? \u2014 \u0412\u043E\u043D\u0430 \u0447\u0435\u043A\u0430\u0454?
- Do they believe? \u2014 \u0412\u043E\u043D\u0438 \u0432\u0456\u0440\u044F\u0442\u044C?

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
\u041F\u0456\u0441\u043B\u044F \u0437\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0430 \u2014 don't (= do not), \u0434\u043B\u044F he / she \u2014 doesn't (= does not). \u0414\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0431\u0435\u0437 -s:
- I don't ask. \u2014 \u042F \u043D\u0435 \u043F\u0438\u0442\u0430\u044E.
- He doesn't believe. \u2014 \u0412\u0456\u043D \u043D\u0435 \u0432\u0456\u0440\u0438\u0442\u044C.

# \u041F\u0440\u0438\u043A\u043B\u0430\u0434 \u0437 \u043F\u0440\u0438\u0432\u0456\u0442\u0430\u043D\u043D\u044F\u043C
- I say "Hello"! \u2014 \u042F \u043A\u0430\u0436\u0443 \xAB\u041F\u0440\u0438\u0432\u0456\u0442\xBB!
- Does he say "Good morning"? \u2014 \u0412\u0456\u043D \u043A\u0430\u0436\u0435 \xAB\u0414\u043E\u0431\u0440\u043E\u0433\u043E \u0440\u0430\u043D\u043A\u0443\xBB?`,de:`# \u0417\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A\u0438
- ich \u2014 \u044F, du \u2014 \u0442\u0438, er \u2014 \u0432\u0456\u043D, sie \u2014 \u0432\u043E\u043D\u0430, es \u2014 \u0432\u043E\u043D\u043E
- wir \u2014 \u043C\u0438, ihr \u2014 \u0432\u0438 (\u043C\u043D.), sie \u2014 \u0432\u043E\u043D\u0438
- Sie \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.): \u0437\u0430\u0432\u0436\u0434\u0438 \u0437 \u0432\u0435\u043B\u0438\u043A\u043E\u0457 \u043B\u0456\u0442\u0435\u0440\u0438, \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u2014 \u044F\u043A \u0456\u0437 sie (\u0432\u043E\u043D\u0438).

# \u0417\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F
\u0412\u0456\u0434 \u0456\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432\u0430 \u0432\u0456\u0434\u043A\u0438\u0434\u0430\u0454\u043C\u043E -en \u0456 \u0434\u043E\u0434\u0430\u0454\u043C\u043E \u0437\u0430\u043A\u0456\u043D\u0447\u0435\u043D\u043D\u044F: leb-en \u2192
- ich lebe, du lebst, er / sie lebt
- wir leben, ihr lebt, Sie / sie leben
- \u041A\u043E\u0440\u0456\u043D\u044C \u043D\u0430 -d / -t \u2014 \u0432\u0441\u0442\u0430\u0432\u043D\u0435 e: du wartest, er wartet.
- \u041A\u043E\u0440\u0456\u043D\u044C \u043D\u0430 -s / -\xDF / -z \u2014 \u0443 du \u043B\u0438\u0448\u0435 -t: du reist.
- \u0406\u043D\u0444\u0456\u043D\u0456\u0442\u0438\u0432 \u043D\u0430 -eln: ich sammle, \u0430\u043B\u0435 du sammelst.

# \u041F\u0438\u0442\u0430\u043D\u043D\u044F
\u0414\u0456\u0454\u0441\u043B\u043E\u0432\u043E \u0441\u0442\u0430\u0454 \u043D\u0430 \u043F\u0435\u0440\u0448\u0435 \u043C\u0456\u0441\u0446\u0435, \u0437\u0430\u0439\u043C\u0435\u043D\u043D\u0438\u043A \u2014 \u043E\u0434\u0440\u0430\u0437\u0443 \u043F\u0456\u0441\u043B\u044F \u043D\u044C\u043E\u0433\u043E:
- Lebst du? \u2014 \u0422\u0438 \u0436\u0438\u0432\u0435\u0448?
- Warten Sie? \u2014 \u0412\u0438 (\u0432\u0432\u0456\u0447\u043B.) \u0447\u0435\u043A\u0430\u0454\u0442\u0435?
- H\xF6rt ihr? \u2014 \u0412\u0438 (\u043C\u043D.) \u0447\u0443\u0454\u0442\u0435?

# \u0417\u0430\u043F\u0435\u0440\u0435\u0447\u0435\u043D\u043D\u044F
nicht \u0441\u0442\u043E\u0457\u0442\u044C \u043F\u0456\u0441\u043B\u044F \u0434\u0456\u0454\u0441\u043B\u043E\u0432\u0430, \u0443 \u043A\u0456\u043D\u0446\u0456 \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0433\u043E \u0440\u0435\u0447\u0435\u043D\u043D\u044F:
- Ich lerne nicht. \u2014 \u042F \u043D\u0435 \u0432\u0447\u0443.
- Sie glauben nicht. \u2014 \u0412\u043E\u043D\u0438 \u043D\u0435 \u0432\u0456\u0440\u044F\u0442\u044C.
